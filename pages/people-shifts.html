<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shift Types — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .page-header-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
    }
    .btn-primary {
      padding: 10px 20px; background: var(--blue, #2d6ae0); color: #fff;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { opacity: .88; }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .shift-card {
      background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 14px; padding: 18px 20px;
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 16px;
    }
    .shift-info { flex: 1; min-width: 0; }
    .shift-name { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .shift-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted, rgba(220,232,255,0.7)); }
    .shift-meta span { background: rgba(100,150,255,0.08); border-radius: 6px; padding: 2px 8px; }
    .shift-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-icon {
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--line, rgba(100,150,255,0.14));
      background: transparent; color: var(--muted, rgba(220,232,255,0.7));
      font-family: inherit; transition: all .15s;
    }
    .btn-icon:hover { color: var(--text, #e6eefc); border-color: rgba(100,150,255,0.3); }
    .btn-del { color: #f87171; border-color: rgba(239,68,68,0.2); }
    .btn-del:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted, rgba(220,232,255,0.7)); }
    .empty strong { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text, #e6eefc); }

    /* Days of week selector */
    .day-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .day-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; cursor: pointer;
      background: rgba(100,150,255,0.07); border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 8px; padding: 5px 10px; user-select: none; transition: all .15s;
    }
    .day-label input { display: none; }
    .day-label.checked { background: rgba(45,106,224,0.2); border-color: rgba(45,106,224,0.5); color: var(--text, #e6eefc); }

    /* Modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 20px; padding: 28px;
      width: 100%; max-width: 480px; margin: 20px;
    }
    .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 800; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 12px; font-weight: 700; color: var(--muted, rgba(220,232,255,0.7)); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .form-row input, .form-row select {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      background: var(--bg, #0c1535); border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--text, #e6eefc); font-size: 14px; font-family: inherit;
    }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--blue, #2d6ae0); }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-secondary {
      padding: 10px 18px; background: transparent;
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--muted, rgba(220,232,255,0.7));
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #166534; color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 200;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">

      <div class="page-header-row">
        <h1>Shift Types</h1>
        <button class="btn-primary" id="addBtn">+ New Shift Type</button>
      </div>

      <div class="card-list" id="shiftList">
        <div class="empty"><strong>Loading…</strong></div>
      </div>

    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Shift Type</h2>
    <input type="hidden" id="editId" />
    <div class="form-row">
      <label>Shift Name *</label>
      <input type="text" id="fieldName" placeholder="e.g. Day Shift, On-Call" />
    </div>
    <div class="form-row form-row-2">
      <div>
        <label>Start Time</label>
        <input type="time" id="fieldStart" />
      </div>
      <div>
        <label>End Time</label>
        <input type="time" id="fieldEnd" />
      </div>
    </div>
    <div class="form-row">
      <label>Break (minutes)</label>
      <input type="number" id="fieldBreak" min="0" placeholder="e.g. 30" />
    </div>
    <div class="form-row">
      <label>Days of Week</label>
      <div class="day-checkboxes" id="dayBoxes"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-shifts.js"></script>
</body>
</html>
