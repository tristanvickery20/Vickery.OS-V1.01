<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>Inventory Items — Vickery Electric CRM</title><link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg"/><link rel="stylesheet" href="/pages/css/shell.css"/><link rel="stylesheet" href="/pages/css/brand.css"/><style>h1{margin:0;font-size:22px;font-weight:900}.asset-page-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}.asset-page-head p{margin:6px 0 0;color:var(--muted,rgba(220,232,255,.65));font-size:13px;line-height:1.4}.asset-note{font-size:12px!important;color:#93c5fd!important}.asset-card{border:1px solid var(--line,rgba(100,150,255,.14));background:var(--panel,#101e45);border-radius:16px;padding:16px;margin-bottom:14px}.asset-card-title{font-weight:900;margin-bottom:12px}.asset-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.asset-form label span{display:block;font-size:11px;font-weight:800;color:var(--muted,rgba(220,232,255,.65));text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.asset-form input,.asset-form textarea{width:100%;box-sizing:border-box;background:var(--bg,#0c1535);border:1px solid var(--line,rgba(100,150,255,.14));border-radius:10px;color:var(--text,#e6eefc);padding:9px;font-family:inherit}.asset-form textarea{min-height:40px}.asset-btn{border:0;background:var(--blue,#2d6ae0);color:#fff;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.asset-btn-wide{grid-column:1/-1}.asset-empty,.asset-error{padding:18px;border:1px dashed rgba(255,255,255,.14);border-radius:12px;color:var(--muted,rgba(220,232,255,.68));font-size:13px;line-height:1.45}.asset-error{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08);color:#fecaca}.asset-table-wrap{overflow-x:auto}.asset-table{width:100%;border-collapse:collapse;font-size:13px}.asset-table th,.asset-table td{padding:10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}.asset-table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted,rgba(220,232,255,.65))}.asset-badge{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:850;background:rgba(96,165,250,.13);color:#93c5fd;margin-top:3px}.asset-badge.good{background:rgba(34,197,94,.12);color:#86efac}.asset-badge.warning{background:rgba(251,191,36,.12);color:#fcd34d}.asset-badge.danger{background:rgba(248,113,113,.12);color:#fca5a5}@media(max-width:800px){.asset-form{grid-template-columns:1fr}}</style></head><body><div class="app-shell"><div class="sidebar" id="sidebarMount"></div><main class="main-area"><div class="page-content"><section id="fleetAssetPage" data-resource="inventory" data-title="Inventory Items" data-primary="item_name" data-description="Track reusable inventory/material item definitions in Google Sheets. This is not accounting inventory valuation." data-fields="item_name,category,unit,default_vendor,estimated_unit_cost,status,notes"></section></div></main></div><script src="/pages/js/shell.js"></script><script src="/pages/js/crm-fleet-assets-page.js"></script></body></html>
