<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270">
  <!-- Wall background -->
  <rect width="360" height="270" fill="#f4f0ec" rx="12"/>
  <!-- Baseboard -->
  <rect x="0" y="238" width="360" height="32" fill="#e8e3de" rx="0"/>
  <line x1="0" y1="238" x2="360" y2="238" stroke="#d0c9c1" stroke-width="1.5"/>

  <!-- Existing outlet nearby (left, for distance reference) -->
  <rect x="40" y="100" width="42" height="56" rx="5" fill="#fff" stroke="#c5bfb9" stroke-width="2"/>
  <rect x="47" y="107" width="28" height="42" rx="3" fill="none" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="61" cy="120" rx="4.5" ry="6" fill="#ccc" stroke="#b0a8a0" stroke-width="1"/>
  <ellipse cx="61" cy="140" rx="4.5" ry="6" fill="#ccc" stroke="#b0a8a0" stroke-width="1"/>
  <text x="61" y="173" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#999">existing outlet</text>

  <!-- Dashed measurement line -->
  <line x1="94" y1="128" x2="186" y2="128" stroke="#3d74d8" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.55"/>
  <polygon points="190,123.5 199,128 190,132.5" fill="#3d74d8" opacity="0.55"/>
  <text x="143" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#3d74d8" font-weight="600" opacity="0.8">measure this distance</text>

  <!-- Blue painter's tape X at work location -->
  <!-- Tape strip 1: NW→SE -->
  <g transform="translate(222,128)">
    <rect x="-52" y="-7" width="104" height="14" rx="3.5" fill="#3d74d8" opacity="0.78" transform="rotate(-36)"/>
    <!-- Tape strip 2: NE→SW -->
    <rect x="-52" y="-7" width="104" height="14" rx="3.5" fill="#3d74d8" opacity="0.78" transform="rotate(36)"/>
    <!-- Center dot -->
    <circle r="7" fill="white" stroke="#2563c9" stroke-width="2.5"/>
    <circle r="2.5" fill="#2563c9"/>
  </g>
  <text x="222" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563c9" font-weight="700">tape X = exact work location</text>

  <!-- Panel path hint (right side) -->
  <rect x="300" y="80" width="36" height="54" rx="4" fill="#fff" stroke="#c5bfb9" stroke-width="1.5"/>
  <line x1="316" y1="88" x2="322" y2="88" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="93" x2="322" y2="93" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="98" x2="322" y2="98" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="103" x2="322" y2="103" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="108" x2="322" y2="108" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="113" x2="322" y2="113" stroke="#aaa" stroke-width="1"/>
  <line x1="316" y1="118" x2="322" y2="118" stroke="#aaa" stroke-width="1"/>
  <text x="318" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#999">panel</text>

  <!-- Step instruction label at top -->
  <rect x="10" y="10" width="340" height="32" rx="8" fill="#2563c9" opacity="0.09"/>
  <text x="180" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#2563c9" font-weight="600">Step back 3–4 ft to show the full area + marked location</text>
</svg>
