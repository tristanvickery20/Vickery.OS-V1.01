<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1d6ed8"/>
    </marker>
    <marker id="arrg" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Overall background -->
  <rect width="280" height="210" fill="#f0f2f4" rx="10"/>

  <!-- Ceiling surface (the main subject — viewed from below) -->
  <rect x="14" y="10" width="252" height="148" rx="3" fill="#f5f4f0"/>

  <!-- Subtle ceiling grid lines -->
  <line x1="14" y1="47" x2="266" y2="47" stroke="#ece9e3" stroke-width="0.8"/>
  <line x1="14" y1="84" x2="266" y2="84" stroke="#ece9e3" stroke-width="0.8"/>
  <line x1="14" y1="121" x2="266" y2="121" stroke="#ece9e3" stroke-width="0.8"/>
  <line x1="77" y1="10" x2="77" y2="158" stroke="#ece9e3" stroke-width="0.8"/>
  <line x1="140" y1="10" x2="140" y2="158" stroke="#ece9e3" stroke-width="0.8"/>
  <line x1="203" y1="10" x2="203" y2="158" stroke="#ece9e3" stroke-width="0.8"/>

  <!-- Left wall strip (room context) -->
  <rect x="0" y="10" width="14" height="148" fill="#dde3eb"/>
  <line x1="14" y1="10" x2="14" y2="158" stroke="#c4cdd8" stroke-width="1.5"/>

  <!-- Right wall strip (room context) -->
  <rect x="266" y="10" width="14" height="148" fill="#dde3eb"/>
  <line x1="266" y1="10" x2="266" y2="158" stroke="#c4cdd8" stroke-width="1.5"/>

  <!-- Bottom wall strip (ceiling meets wall) -->
  <rect x="0" y="158" width="280" height="22" fill="#e4eaf0"/>
  <line x1="0" y1="158" x2="280" y2="158" stroke="#c4cdd8" stroke-width="1.5"/>

  <!-- Top edge (near camera / camera end of ceiling) -->
  <rect x="0" y="0" width="280" height="10" fill="#dde3eb" rx="0"/>

  <!-- Junction box / ceiling box (centered) -->
  <!-- Outer mounting ring -->
  <circle cx="140" cy="82" r="17" fill="#d4dbe5" stroke="#8898aa" stroke-width="1.5"/>
  <!-- Inner box face -->
  <circle cx="140" cy="82" r="11" fill="#c0cad6"/>
  <!-- Cross slots on face -->
  <line x1="133" y1="82" x2="147" y2="82" stroke="#8898aa" stroke-width="1.5"/>
  <line x1="140" y1="75" x2="140" y2="89" stroke="#8898aa" stroke-width="1.5"/>
  <!-- Mounting screws at ring edge -->
  <circle cx="128" cy="70" r="2.5" fill="#8898aa"/>
  <circle cx="152" cy="70" r="2.5" fill="#8898aa"/>
  <circle cx="128" cy="94" r="2.5" fill="#8898aa"/>
  <circle cx="152" cy="94" r="2.5" fill="#8898aa"/>

  <!-- Target circle (dashed, shows where to center the shot) -->
  <circle cx="140" cy="82" r="34" fill="none" stroke="#1d6ed8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Callout arrow + label (upper right) -->
  <line x1="188" y1="52" x2="162" y2="72" stroke="#1d6ed8" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="198" y="43" text-anchor="middle" fill="#1d6ed8" font-size="7" font-weight="bold" font-family="Arial,sans-serif">ceiling box /</text>
  <text x="198" y="52" text-anchor="middle" fill="#1d6ed8" font-size="7" font-weight="bold" font-family="Arial,sans-serif">fan mount</text>

  <!-- Ceiling height dimension (right side) -->
  <line x1="255" y1="22" x2="255" y2="148" stroke="#94a3b8" stroke-width="0.9" stroke-dasharray="3,2"/>
  <line x1="250" y1="22" x2="260" y2="22" stroke="#94a3b8" stroke-width="1"/>
  <line x1="250" y1="148" x2="260" y2="148" stroke="#94a3b8" stroke-width="1"/>
  <text x="248" y="88" text-anchor="middle" fill="#94a3b8" font-size="6.5" font-family="Arial,sans-serif" transform="rotate(-90 248 88)">ceiling ht.</text>

  <!-- "Frame from below" instruction banner -->
  <rect x="22" y="165" width="236" height="18" rx="5" fill="#1d6ed8" opacity="0.08"/>
  <text x="140" y="177" text-anchor="middle" fill="#1d6ed8" font-size="8" font-weight="600" font-family="Arial,sans-serif">Tilt phone up — center the box in your frame</text>

  <!-- Caption -->
  <text x="140" y="202" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Arial,sans-serif">Example — show ceiling, mounting box, and ceiling height context</text>
</svg>
