<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210">
  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#1d6ed8"/>
    </marker>
  </defs>

  <!-- Sky background -->
  <rect width="280" height="210" fill="#f0f2f4" rx="10"/>

  <!-- Sky -->
  <rect x="0" y="0" width="280" height="40" fill="#e8eef5" rx="10"/>
  <rect x="0" y="30" width="280" height="12" fill="#e8eef5"/>

  <!-- Soffit / overhang -->
  <rect x="0" y="30" width="280" height="18" fill="#d4dce6" stroke="#b8c4d0" stroke-width="0"/>
  <line x1="0" y1="30" x2="280" y2="30" stroke="#a8b4c0" stroke-width="1"/>
  <line x1="0" y1="48" x2="280" y2="48" stroke="#a8b4c0" stroke-width="1.5"/>

  <!-- House siding (horizontal lap siding) -->
  <rect x="0" y="48" width="280" height="130" fill="#f2f0ed"/>
  <!-- Siding horizontal lines -->
  <line x1="0" y1="60" x2="280" y2="60" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="72" x2="280" y2="72" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="84" x2="280" y2="84" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="96" x2="280" y2="96" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="108" x2="280" y2="108" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="120" x2="280" y2="120" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="132" x2="280" y2="132" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="144" x2="280" y2="144" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="156" x2="280" y2="156" stroke="#e2dfd8" stroke-width="1.2"/>
  <line x1="0" y1="168" x2="280" y2="168" stroke="#e2dfd8" stroke-width="1.2"/>

  <!-- Ground -->
  <rect x="0" y="178" width="280" height="32" fill="#dde3e8"/>
  <line x1="0" y1="178" x2="280" y2="178" stroke="#b8c4d0" stroke-width="1.5"/>

  <!-- Existing outdoor light (left side, for reference) -->
  <rect x="38" y="52" width="20" height="26" rx="3" fill="#d0d8e2" stroke="#94a3b8" stroke-width="1.2"/>
  <circle cx="48" cy="61" r="5" fill="#f0e8c0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="44" y="70" width="8" height="4" rx="1" fill="#94a3b8"/>
  <text x="48" y="89" text-anchor="middle" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">existing</text>
  <text x="48" y="96" text-anchor="middle" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">light</text>

  <!-- Conduit running up wall from existing light toward target area -->
  <rect x="56" y="48" width="5" height="80" rx="2" fill="#c4cdd8"/>
  <rect x="56" y="45" width="5" height="6" rx="1" fill="#94a3b8"/>

  <!-- Target zone for new light - dashed outline box -->
  <rect x="150" y="50" width="68" height="80" rx="6" fill="rgba(29,110,216,0.05)" stroke="#1d6ed8" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Light fixture silhouette inside target box -->
  <rect x="166" y="60" width="36" height="28" rx="4" fill="#e8f0fc" stroke="#1d6ed8" stroke-width="1.5"/>
  <!-- Light head -->
  <rect x="171" y="65" width="26" height="16" rx="2" fill="#c7d9f8"/>
  <!-- Mounting bracket on soffit -->
  <rect x="178" y="54" width="12" height="8" rx="2" fill="#b0c4e8" stroke="#1d6ed8" stroke-width="1"/>
  <!-- Conduit from mounting box going down -->
  <rect x="182" y="88" width="4" height="42" rx="1.5" fill="#b0c0d0"/>

  <text x="184" y="142" text-anchor="middle" fill="#1d6ed8" font-size="6.5" font-weight="bold" font-family="Arial,sans-serif">NEW LIGHT</text>
  <text x="184" y="150" text-anchor="middle" fill="#1d6ed8" font-size="6" font-family="Arial,sans-serif">LOCATION</text>

  <!-- Arrow from label to target box -->
  <line x1="108" y1="88" x2="146" y2="88" stroke="#1d6ed8" stroke-width="1.8" marker-end="url(#arr2)"/>
  <text x="102" y="78" text-anchor="middle" fill="#1d6ed8" font-size="7" font-weight="bold" font-family="Arial,sans-serif">show this</text>
  <text x="102" y="88" text-anchor="middle" fill="#1d6ed8" font-size="7" font-weight="bold" font-family="Arial,sans-serif">whole area</text>

  <!-- Caption -->
  <text x="140" y="202" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Arial,sans-serif">Example — show mounting area, siding/soffit, and nearest existing light</text>
</svg>
