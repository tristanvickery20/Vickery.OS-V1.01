  <!-- Door inner label area -->
  <rect x="40" y="30" width="36" height="60" rx="2" fill="#d0d8e0"/>
  <line x1="44" y1="38" x2="72" y2="38" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="45" x2="72" y2="45" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="52" x2="72" y2="52" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="59" x2="66" y2="59" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="66" x2="72" y2="66" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="73" x2="60" y2="73" stroke="#8898aa" stroke-width="0.8"/>
  <line x1="44" y1="80" x2="72" y2="80" stroke="#8898aa" stroke-width="0.8"/>
  <text x="58" y="108" text-anchor="middle" fill="#8898aa" font-size="6.5" font-family="Arial,sans-serif">CIRCUIT</text>
