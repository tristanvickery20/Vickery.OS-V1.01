  <rect x="158" y="93" width="16" height="7" rx="1" fill="#475569"/>
  <text x="180" y="99" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">Dryer</text>

  <rect x="154" y="106" width="58" height="13" rx="2" fill="#1e293b"/>
  <rect x="158" y="109" width="16" height="7" rx="1" fill="#475569"/>
  <text x="180" y="115" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">Bath</text>

  <rect x="154" y="122" width="58" height="13" rx="2" fill="#1e293b"/>
  <rect x="158" y="125" width="16" height="7" rx="1" fill="#0f172a"/>
  <text x="180" y="131" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">Living Rm</text>

  <rect x="154" y="138" width="58" height="13" rx="2" fill="#1e293b"/>
  <rect x="158" y="141" width="16" height="7" rx="1" fill="#475569"/>
  <text x="180" y="147" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">Spare</text>

  <rect x="154" y="154" width="58" height="13" rx="2" fill="#1e293b"/>
  <rect x="158" y="157" width="16" height="7" rx="1" fill="#0f172a"/>
  <text x="180" y="163" fill="#94a3b8" font-size="6" font-family="Arial,sans-serif">Spare</text>

  <!-- "EXAMPLE" caption -->
  <text x="140" y="202" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-family="Arial,sans-serif">Example — open door fully so all breakers are visible</text>
