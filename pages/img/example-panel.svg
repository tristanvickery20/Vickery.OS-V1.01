  <rect x="92" y="28" width="124" height="22" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <rect x="96" y="32" width="52" height="14" rx="2" fill="#1d4ed8"/>
  <rect x="152" y="32" width="60" height="14" rx="2" fill="#374151"/>
  <text x="122" y="42" text-anchor="middle" fill="white" font-size="8" font-weight="bold" font-family="Arial,sans-serif">MAIN</text>
  <text x="182" y="42" text-anchor="middle" fill="#d1d5db" font-size="7" font-family="Arial,sans-serif">200A</text>

