<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <img src="/pages/img/logo.png" alt="Vickery Electric" class="header-logo" />
        <span class="header-title">CRM Portal</span>
      </div>
    </header>

    <nav class="app-nav">
      <div class="nav-inner">
        <a class="nav-link" href="/crm/dashboard">Dashboard</a>
        <a class="nav-link" href="/clients">Clients</a>
        <a class="nav-link" href="/crm/new">New Client</a>
        <a class="nav-link" href="/crm/schedule">Schedule</a>
        <a class="nav-link" href="/crm/time">Time</a>
        <a class="nav-link" href="/crm/expenses">Expenses</a>
      </div>
    </nav>

    <main class="main-content">
      <h1>Welcome to Vickery CRM</h1>
      <p class="muted" style="margin-bottom: 28px;">Pick where you'd like to go.</p>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; max-width: 700px;">
        <a href="/crm/dashboard" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#128202;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">Dashboard</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Overview &amp; KPIs</div>
          </div>
        </a>
        <a href="/clients" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#128203;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">Clients</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Client book</div>
          </div>
        </a>
        <a href="/crm/new" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#10133;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">New Client</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Create a new entry</div>
          </div>
        </a>
        <a href="/crm/schedule" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#128197;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">Schedule</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Today's appointments</div>
          </div>
        </a>
        <a href="/crm/time" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#9201;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">Time</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Log work hours</div>
          </div>
        </a>
        <a href="/crm/expenses" style="text-decoration: none;">
          <div class="kpi-card" style="text-align: center; padding: 28px 20px;">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: hsl(var(--primary) / 0.08); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 22px;">&#128176;</div>
            <div style="font-family: var(--font-display); font-weight: 600; font-size: 16px; color: hsl(var(--foreground));">Expenses</div>
            <div class="muted" style="font-size: 13px; margin-top: 4px;">Track gas &amp; materials</div>
          </div>
        </a>
      </div>
    </main>
  </body>
</html>
