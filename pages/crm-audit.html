<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit Log &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
    <style>
      .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
      .filters input, .filters select { padding: 6px 10px; border: 1px solid hsl(var(--border)); border-radius: var(--radius); font-size: 0.85rem; }
      .filters input { width: 200px; }
      .audit-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
      .audit-table th, .audit-table td { padding: 6px 8px; border-bottom: 1px solid hsl(var(--border)); text-align: left; white-space: nowrap; }
      .audit-table th { background: hsl(var(--secondary)); font-weight: 600; position: sticky; top: 0; }
      .audit-table td { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
      .table-wrap { overflow-x: auto; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <button id="refreshBtn" style="display:none;" type="button">Refresh</button>
        <div class="main-content">
          <p id="auditCount" class="muted small" style="margin-bottom:8px;">Loading...</p>

          <div class="filters">
            <input id="filterEntity" placeholder="Filter by entity ID..." />
            <select id="filterAction">
              <option value="">All actions</option>
              <option value="lead.create">lead.create</option>
              <option value="lead.update">lead.update</option>
              <option value="lead.status">lead.status</option>
              <option value="lead.schedule">lead.schedule</option>
              <option value="lead.status.blocked">lead.status.blocked</option>
              <option value="quote.create">quote.create</option>
              <option value="time.create">time.create</option>
              <option value="expense.create">expense.create</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="audit-table">
              <thead>
                <tr>
                  <th>When</th>
                  <th>Actor</th>
                  <th>Action</th>
                  <th>Type</th>
                  <th>Entity ID</th>
                  <th>Field</th>
                  <th>Old</th>
                  <th>New</th>
                  <th>Note</th>
                  <th>Source</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-audit.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
