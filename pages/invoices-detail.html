<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invoice Detail • Vickery Electric CRM</title>

  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#0f1621;
      --panel2:#0c121b;
      --text:#e6eefc;
      --muted:rgba(230,238,252,0.70);
      --line:rgba(255,255,255,0.10);
      --line2:rgba(255,255,255,0.08);
      --blue:#3b82f6;
      --red:#f87171;
      --green:#34d399;
    }
    html,body{ height:100%; }
    body{ margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    .shell{ min-height:100vh; display:flex; }
    .sidebar{
      width:260px; flex:0 0 260px;
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-right:1px solid var(--line);
      position: sticky; top:0; height:100vh;
      overflow:auto;
    }
    .main{ flex:1; min-width:0; padding:16px; }

    /* sidebar hardening */
    .sidebar a{ color:var(--text); text-decoration:none; }
    .sidebar .sidebar-header{ padding:14px 14px 8px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:10px; }
    .sidebar .sidebar-logo{ width:34px; height:34px; border-radius:10px; }
    .sidebar .sidebar-brand{ font-weight:800; line-height:1.1; }
    .sidebar .sidebar-brand small{ display:block; font-weight:600; opacity:0.7; margin-top:2px; }
    .sidebar .create-wrap{ padding:10px 14px 0; }
    .sidebar .create-btn{
      width:100%;
      display:flex; align-items:center; justify-content:space-between;
      background: rgba(59,130,246,0.18);
      border:1px solid rgba(59,130,246,0.45);
      color:white; padding:10px 12px; border-radius:12px; font-weight:800;
    }
    .sidebar .create-menu{
      margin:10px 14px 0;
      border:1px solid var(--line2);
      border-radius:12px;
      overflow:hidden;
      display:none;
      background: rgba(255,255,255,0.03);
    }
    .sidebar .create-menu.open{ display:block; }
    .sidebar .create-menu a{ display:block; padding:10px 12px; border-bottom:1px solid var(--line2); font-size:14px; }
    .sidebar .create-menu a:last-child{ border-bottom:none; }
    .sidebar .sidebar-nav{ padding:10px 8px 16px; }
    .sidebar .sidebar-section-title{ padding:10px 10px 6px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.6; }
    .sidebar .sidebar-link{ display:flex; align-items:center; gap:10px; padding:10px 10px; margin:4px 6px; border-radius:12px; border:1px solid transparent; font-weight:700; font-size:14px; }
    .sidebar .sidebar-link:hover{ background: rgba(255,255,255,0.04); border-color: var(--line2); }

    /* Mobile drawer */
    .mobile-bar{
      display:none;
      position: sticky; top:0;
      z-index:50;
      background: rgba(11,15,20,0.85);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line2);
      padding:10px 12px;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .mobile-bar .m-btn{
      border:1px solid var(--line2);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      font-weight:900;
    }
    .backdrop{ display:none; position:fixed; inset:0; background: rgba(0,0,0,0.55); z-index:60; }

    @media (max-width: 980px){
      .sidebar{
        position:fixed; left:0; top:0; bottom:0;
        transform: translateX(-102%);
        transition: transform .18s ease;
        z-index:70;
        box-shadow: 30px 0 80px rgba(0,0,0,0.55);
      }
      .sidebar.open{ transform: translateX(0); }
      .backdrop.show{ display:block; }
      .mobile-bar{ display:flex; }
      .main{ padding:12px; }
    }

    /* Main UI */
    .top{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      margin-bottom:12px;
      align-items:flex-start;
    }
    .title{ font-size:22px; font-weight:900; }
    .sub{ font-size:13px; opacity:.75; margin-top:4px; }
    .actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{
      padding:10px 12px; border-radius:12px;
      border:1px solid rgba(59,130,246,0.45);
      background: rgba(59,130,246,0.18);
      color:white; font-weight:900; cursor:pointer;
    }
    .btn.secondary{ border-color: var(--line2); background: rgba(255,255,255,0.03); }
    .btn.danger{ border-color: rgba(248,113,113,0.55); background: rgba(248,113,113,0.16); }

    .grid{ display:grid; grid-template-columns: 1.2fr 0.8fr; gap:14px; }
    .card{ background: rgba(255,255,255,0.03); border:1px solid var(--line2); border-radius:16px; padding:14px; }
    .row{ display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line2); }
    .row:last-child{ border-bottom:none; }
    .k{ font-size:12px; opacity:.65; text-transform:uppercase; letter-spacing:.08em; }
    .v{ font-weight:800; text-align:right; }

    .badge{ display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; border:1px solid var(--line2); background: rgba(255,255,255,0.03); font-size:12px; font-weight:900; }
    .dot{ width:8px; height:8px; border-radius:50%; background:#94a3b8; }
    .st-paid .dot{ background: var(--green); }
    .st-sent .dot{ background: #60a5fa; }
    .st-overdue .dot{ background: var(--red); }
    .st-void .dot{ background:#a1a1aa; }

    .input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line2);
      background: rgba(255,255,255,0.03);
      color:var(--text);
      outline:none;
    }
    textarea{ min-height: 90px; resize: vertical; }
    .status{ margin-top:10px; font-size:13px; opacity:.8; }

    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="backdrop" id="backdrop"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebarMount"></aside>

    <main class="main">
      <div class="mobile-bar">
        <button class="m-btn" id="menuBtn">Menu</button>
        <button class="m-btn" onclick="location.href='/invoices'">Back</button>
        <button class="m-btn" id="refreshBtnMobile">Refresh</button>
      </div>

      <div class="top">
        <div>
          <div class="title" id="invTitle">Invoice</div>
          <div class="sub"><a href="/invoices" style="color:#60a5fa; font-weight:900; text-decoration:none;">← Back to Invoices</a></div>
        </div>
        <div class="actions">
          <button class="btn secondary" id="refreshBtn">Refresh</button>
          <button class="btn" id="markSentBtn">Mark Sent</button>
          <button class="btn danger" id="voidBtn">Void</button>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px;">
            <div class="badge" id="statusBadge"><span class="dot"></span><span id="statusText">Draft</span></div>
            <div style="font-size:13px; opacity:.8;" id="hint"></div>
          </div>

          <div id="detail">
            <div class="status">Loading…</div>
          </div>

          <div style="margin-top:14px;">
            <div class="k" style="margin-bottom:6px;">Internal Notes</div>
            <textarea id="notes"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
              <button class="btn secondary" id="saveNotesBtn">Save Notes</button>
            </div>
            <div class="status" id="notesMsg"></div>
          </div>
        </section>

        <aside class="card">
          <div class="k" style="margin-bottom:8px;">Add Payment</div>
          <form id="payForm" style="display:grid; gap:10px;">
            <input id="amount" class="input" inputmode="decimal" placeholder="Amount (e.g. 100.00)" />
            <select id="method" class="input">
              <option value="">Method (optional)</option>
              <option value="cash">Cash</option>
              <option value="check">Check</option>
              <option value="card">Card</option>
              <option value="ach">ACH</option>
              <option value="other">Other</option>
            </select>
            <input id="ref" class="input" placeholder="Reference (optional)" />
            <input id="note" class="input" placeholder="Note (optional)" />
            <button class="btn" type="submit">Record Payment</button>
          </form>
          <div class="status" id="payMsg"></div>
        </aside>
      </div>

      <div class="status" id="pageMsg"></div>
    </main>
  </div>

  <script>
    // drawer
    const backdrop = document.getElementById("backdrop");
    function openSidebar(){ document.querySelector(".sidebar").classList.add("open"); backdrop.classList.add("show"); }
    function closeSidebar(){ document.querySelector(".sidebar").classList.remove("open"); backdrop.classList.remove("show"); }
    backdrop.addEventListener("click", closeSidebar);
    document.getElementById("menuBtn").addEventListener("click", openSidebar);

    function norm(s){ return String(s||"").toLowerCase().trim(); }
    function money(v){ const n = Number(v||0); return isFinite(n) ? n.toLocaleString(undefined,{style:"currency",currency:"USD"}) : "$0.00"; }
    function fmtDate(val){
      if (!val || typeof val !== "string") return "";
      try { const d = new Date(val); if (isNaN(d.getTime())) return ""; return d.toLocaleString(); } catch { return ""; }
    }
    function getId(){
      const parts = location.pathname.split("/").filter(Boolean);
      return decodeURIComponent(parts[1] || "");
    }

    async function loadSidebar(){
      try{
        const resp = await fetch("/pages/partials/sidebar.html", { cache:"no-store" });
        document.getElementById("sidebarMount").innerHTML = await resp.text();

        // create dropdown behavior
        const createBtn = document.querySelector(".create-btn");
        const createMenu = document.querySelector(".create-menu");
        if (createBtn && createMenu) createBtn.addEventListener("click", (e)=>{ e.preventDefault(); createMenu.classList.toggle("open"); });

        // close drawer on click
        document.querySelectorAll(".sidebar a").forEach(a => {
          a.addEventListener("click", () => {
            if (matchMedia("(max-width: 980px)").matches) closeSidebar();
          });
        });
      } catch {}
    }

    async function api(path, opts){
      const r = await fetch(path, Object.assign({ cache:"no-store" }, opts||{}));
      let data = null;
      try { data = await r.json(); } catch { data = { ok:false, error:"Bad JSON" }; }
      return data;
    }

    function setBadge(status, overdue){
      const b = document.getElementById("statusBadge");
      b.classList.remove("st-paid","st-sent","st-overdue","st-void");
      const s = norm(status);
      if (overdue) b.classList.add("st-overdue");
      else if (s === "paid") b.classList.add("st-paid");
      else if (s === "sent") b.classList.add("st-sent");
      else if (s === "void") b.classList.add("st-void");
      document.getElementById("statusText").textContent = overdue ? "Overdue" : (s ? s[0].toUpperCase()+s.slice(1) : "Draft");
    }

    let CURRENT = null;

    function render(inv){
      CURRENT = inv;
      const invNum = inv.invoice_number || inv.id || "Invoice";
      document.getElementById("invTitle").textContent = invNum;

      setBadge(inv.status_code, !!inv.overdue);

      const bal = Number(inv.balance_due || 0);
      document.getElementById("hint").textContent =
        (norm(inv.status_code) === "paid" || bal <= 0) ? "✅ Paid" : "";

      document.getElementById("notes").value = inv.notes || "";

      const rows = [
        ["Invoice ID", inv.id || ""],
        ["Invoice #", inv.invoice_number || ""],
        ["Client", inv.client_name || inv.client_id || ""],
        ["Address", inv.property_address || ""],
        ["Request ID", inv.request_id || ""],
        ["Issued", fmtDate(inv.issued_at || inv.created_at)],
        ["Due", fmtDate(inv.due_at)],
        ["Total", money(inv.total)],
        ["Deposit Applied", money(inv.deposit_applied)],
        ["Paid", money(inv.paid_amount)],
        ["Balance Due", money(inv.balance_due)],
        ["Status", inv.overdue ? "Overdue" : (inv.status_code || "")],
      ];

      document.getElementById("detail").innerHTML = rows.map(([k,v]) => `
        <div class="row"><div class="k">${k}</div><div class="v">${String(v||"")}</div></div>
      `).join("");
    }

    async function load(){
      const id = getId();
      const msg = document.getElementById("pageMsg");
      msg.textContent = "";

      const data = await api("/api/invoices/" + encodeURIComponent(id));
      if (!data || !data.ok){ msg.textContent = (data && data.error) ? data.error : "Error loading invoice."; return; }
      render(data.invoice || {});
    }

    async function patch(fields){
      const id = getId();
      return api("/api/invoices/" + encodeURIComponent(id), {
        method:"PATCH",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(fields || {})
      });
    }

    document.getElementById("refreshBtn").addEventListener("click", load);
    document.getElementById("refreshBtnMobile").addEventListener("click", load);

    document.getElementById("markSentBtn").addEventListener("click", async ()=>{
      const msg = document.getElementById("pageMsg");
      msg.textContent = "Saving…";
      const r = await patch({ status_code:"sent" });
      msg.textContent = (r && r.ok) ? "Updated." : ((r && r.error) ? r.error : "Failed.");
      load();
    });

    document.getElementById("voidBtn").addEventListener("click", async ()=>{
      if (!confirm("Void this invoice?")) return;
      const msg = document.getElementById("pageMsg");
      msg.textContent = "Voiding…";
      const r = await patch({ status_code:"void" });
      msg.textContent = (r && r.ok) ? "Voided." : ((r && r.error) ? r.error : "Failed.");
      load();
    });

    document.getElementById("saveNotesBtn").addEventListener("click", async ()=>{
      const notesMsg = document.getElementById("notesMsg");
      notesMsg.textContent = "Saving…";
      const r = await patch({ notes: document.getElementById("notes").value || "" });
      notesMsg.textContent = (r && r.ok) ? "Saved." : ((r && r.error) ? r.error : "Failed.");
      load();
    });

    document.getElementById("payForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const payMsg = document.getElementById("payMsg");
      payMsg.textContent = "Recording…";

      const invoice_id = getId();
      const amount = document.getElementById("amount").value.trim();
      const method = document.getElementById("method").value;
      const reference = document.getElementById("ref").value.trim();
      const note = document.getElementById("note").value.trim();

      const r = await api("/api/payments", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ invoice_id, amount, method, reference, note })
      });

      if (!r || !r.ok){
        payMsg.textContent = (r && (r.error || r.message)) ? (r.error || r.message) : "Payment failed.";
        return;
      }

      payMsg.textContent = "Recorded. Balance: " + money(r.balance_due);
      document.getElementById("amount").value = "";
      document.getElementById("ref").value = "";
      document.getElementById("note").value = "";
      load();
    });

    loadSidebar();
    load();
  </script>
</body>
</html>
