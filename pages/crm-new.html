<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Lead &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="main-content">
          <div class="form-card">
            <div class="form-group">
              <label class="form-label">Name</label>
              <input id="name" placeholder="Customer name" />
            </div>

            <div class="form-group">
              <label class="form-label">Phone</label>
              <input id="phone" placeholder="(555) 123-4567" />
            </div>

            <div class="form-group">
              <label class="form-label">Address</label>
              <input id="address" placeholder="Street address" />
            </div>

            <div class="form-group">
              <label class="form-label">Lead Source</label>
              <select id="lead_source">
                <option value="">-- Select Source --</option>
                <option value="GBP">GBP (Google Business Profile)</option>
                <option value="Organic SEO">Organic SEO</option>
                <option value="LSA">LSA (Local Services Ads)</option>
                <option value="Google Ads">Google Ads</option>
                <option value="Direct">Direct (Walk-in / Call-in)</option>
                <option value="Referral">Referral</option>
                <option value="Yard Sign">Yard Sign</option>
                <option value="Truck Wrap">Truck Wrap</option>
                <option value="Repeat Customer">Repeat Customer</option>
                <option value="Facebook">Facebook</option>
                <option value="Manual Outreach">Manual Outreach</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Job Type</label>
              <select id="job_type">
                <option value="small_job">Small Job / Troubleshooting</option>
                <option value="project">Larger Project</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Deposit Required?</label>
              <select id="deposit_required">
                <option value="false">No</option>
                <option value="true">Yes</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Estimated Value ($)</label>
              <input id="estimated_value" type="number" min="0" step="1" placeholder="0" />
            </div>

            <div class="form-group">
              <label class="form-label">Duration (minutes)</label>
              <input id="duration_minutes" type="number" min="0" step="15" value="60" />
            </div>

            <div class="form-group">
              <label class="form-label">Schedule Preference</label>
              <input id="schedule_preference" placeholder="e.g. morning, afternoon, evening" />
            </div>

            <div class="form-group">
              <label class="form-label">Target Date</label>
              <input id="target_date" type="date" />
            </div>

            <div class="form-group">
              <label class="form-label">Scheduled Date/Time</label>
              <input id="scheduled_date" type="datetime-local" />
            </div>

            <div class="form-group">
              <label class="form-label">Assigned Tech</label>
              <select id="assigned_to"><option value="">(unassigned)</option></select>
            </div>

            <div class="form-group">
              <label class="form-label">Notes</label>
              <textarea id="notes" placeholder="Additional details..."></textarea>
            </div>

            <div style="display:flex;gap:8px;margin-top:8px;">
              <button id="createBtn" type="button" class="btn-primary" style="flex:1;">Create Lead</button>
              <button id="suggestBtn" type="button" style="flex:0 0 auto;padding:8px 16px;">Suggest Time</button>
            </div>
            <p id="suggestResult" class="small muted" style="margin-top:8px;text-align:center;"></p>
            <p id="result" class="muted" style="margin-top: 4px; text-align: center;"></p>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/schedule-suggest.js"></script>
    <script>
      const resultEl = document.getElementById("result");
      const createBtn = document.getElementById("createBtn");
      const suggestEl = document.getElementById("suggestResult");

      (async () => {
        try {
          const d = await window.Api.fetchJson("/api/techs");
          const sel = document.getElementById("assigned_to");
          for (const t of (d.techs || [])) {
            const o = document.createElement("option");
            o.value = t.id; o.textContent = t.name + " (" + t.id + ")";
            sel.appendChild(o);
          }
        } catch(e) {}
      })();

      document.getElementById("suggestBtn").addEventListener("click", async () => {
        const td = document.getElementById("target_date").value || window.ScheduleSuggest.todayStr();
        const dur = Number(document.getElementById("duration_minutes").value || 60);
        const pref = document.getElementById("schedule_preference").value;
        suggestEl.innerHTML = "Finding slot...";
        try {
          const r = await window.ScheduleSuggest.fetchSuggestion(td, dur, pref);
          if (r.ok) {
            suggestEl.textContent = r.reason + " ";
            const applyBtn = document.createElement("button");
            applyBtn.type = "button"; applyBtn.textContent = "Apply";
            applyBtn.style.cssText = "font-size:12px;padding:2px 8px;background:hsl(var(--primary));color:white;border:none;border-radius:4px;cursor:pointer;";
            applyBtn.addEventListener("click", () => {
              document.getElementById("scheduled_date").value = r.suggested_start_time;
              document.getElementById("assigned_to").value = r.suggested_tech_id;
              suggestEl.textContent = "Applied \u2705";
            });
            suggestEl.appendChild(applyBtn);
          } else {
            suggestEl.textContent = r.reason || r.error || "No slot found.";
          }
        } catch (e) { suggestEl.textContent = "Error: " + e.message; }
      });

      createBtn.addEventListener("click", async () => {
        resultEl.textContent = "Saving...";
        resultEl.className = "muted";
        const payload = {
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          address: document.getElementById("address").value,
          lead_source: document.getElementById("lead_source").value,
          job_type: document.getElementById("job_type").value,
          deposit_required: document.getElementById("deposit_required").value === "true",
          estimated_value: Number(document.getElementById("estimated_value").value || 0),
          notes: document.getElementById("notes").value,
          duration_minutes: Number(document.getElementById("duration_minutes").value || 0),
          schedule_preference: document.getElementById("schedule_preference").value,
          scheduled_date: document.getElementById("scheduled_date").value,
          assigned_to: document.getElementById("assigned_to").value,
        };

        try {
          const data = await window.Api.fetchJson("/api/leads", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          resultEl.textContent = "Lead created successfully!";
          resultEl.className = "success-msg";
        } catch (e) {
          resultEl.textContent = "ERROR: " + e.message;
          resultEl.className = "warn";
        }
      });
    </script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
