<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Detail &bull; Vickery CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
    <style>
      .ld-back {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 13px; font-weight: 600; color: hsl(var(--muted-foreground));
        text-decoration: none; margin-bottom: 16px;
        transition: color .15s;
      }
      .ld-back:hover { color: hsl(var(--foreground)); }

      .ld-hero {
        display: flex; align-items: flex-start; justify-content: space-between;
        flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
      }
      .ld-hero-left { display: flex; align-items: center; gap: 14px; }
      .ld-avatar {
        width: 52px; height: 52px; border-radius: 50%;
        background: hsl(var(--primary) / 0.12); display: flex;
        align-items: center; justify-content: center; flex-shrink: 0;
      }
      .ld-avatar svg { color: hsl(var(--primary)); }
      .ld-hero-name { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.2; }
      .ld-hero-sub { font-size: 13px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
      .ld-status-badge {
        display: inline-block; padding: 3px 10px; border-radius: 20px;
        font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
        margin-left: 10px; vertical-align: middle;
      }

      .ld-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .ld-btn {
        padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
        cursor: pointer; border: 1px solid hsl(var(--border)); background: hsl(var(--background));
        color: hsl(var(--foreground)); transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
      }
      .ld-btn:hover { background: hsl(var(--muted)); }
      .ld-btn-primary { background: hsl(var(--primary)); color: white; border-color: hsl(var(--primary)); }
      .ld-btn-primary:hover { opacity: .9; }
      .ld-btn-danger { background: hsl(0 70% 50%); color: white; border-color: hsl(0 70% 50%); }
      .ld-btn-danger:hover { opacity: .9; }

      .ld-grid {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 860px) { .ld-grid { grid-template-columns: 1fr; } }

      .ld-card {
        background: hsl(var(--card));
        border: 1px solid hsl(var(--border));
        border-radius: 16px;
        padding: 20px 22px;
        margin-bottom: 16px;
      }
      .ld-card:last-child { margin-bottom: 0; }
      .ld-card-title {
        font-family: var(--font-display); font-size: 15px; font-weight: 800;
        margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
      }
      .ld-card-title-actions { display: flex; gap: 6px; }

      .ld-field-row {
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: 8px 0; border-bottom: 1px solid hsl(var(--border));
        gap: 12px;
      }
      .ld-field-row:last-child { border-bottom: none; padding-bottom: 0; }
      .ld-field-label { font-size: 13px; color: hsl(var(--muted-foreground)); min-width: 110px; flex-shrink: 0; }
      .ld-field-value { font-size: 13px; font-weight: 500; text-align: right; word-break: break-word; }
      .ld-field-value a { color: hsl(var(--primary)); text-decoration: none; }
      .ld-field-value a:hover { text-decoration: underline; }

      .ld-fin-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      }
      .ld-fin-item {
        background: hsl(var(--muted) / 0.5); border-radius: 10px;
        padding: 12px 14px;
      }
      .ld-fin-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
      .ld-fin-value { font-size: 18px; font-weight: 800; font-family: var(--font-display); margin-top: 2px; }

      .ld-notes-text {
        font-size: 13px; line-height: 1.7; color: hsl(var(--foreground));
        white-space: pre-wrap; min-height: 48px;
      }
      .ld-notes-empty { color: hsl(var(--muted-foreground)); font-style: italic; font-size: 13px; }
      .ld-notes-editor {
        width: 100%; padding: 10px 12px; font-size: 13px; font-family: var(--font-body);
        border: 1px solid hsl(var(--border)); border-radius: 8px;
        background: hsl(var(--background)); color: hsl(var(--foreground));
        resize: vertical; min-height: 80px; line-height: 1.6;
        display: none;
      }
      .ld-notes-editor:focus { outline: none; border-color: hsl(var(--primary)); }

      .ld-status-select {
        width: 100%; padding: 9px 12px; font-size: 13px; font-family: var(--font-body);
        border: 1px solid hsl(var(--border)); border-radius: 8px;
        background: hsl(var(--background)); color: hsl(var(--foreground));
        cursor: pointer;
      }
      .ld-status-select:focus { outline: none; border-color: hsl(var(--primary)); }

      .ld-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; margin-top: 8px; }
      .ld-msg.ok { background: hsl(142 50% 93%); color: hsl(142 50% 25%); }
      .ld-msg.err { background: hsl(0 70% 94%); color: hsl(0 70% 35%); }
      html.dark .ld-msg.ok { background: hsl(142 40% 12%); color: hsl(142 50% 70%); }
      html.dark .ld-msg.err { background: hsl(0 60% 14%); color: hsl(0 70% 70%); }

      .ld-loading { padding: 48px; text-align: center; color: hsl(var(--muted-foreground)); font-size: 14px; }

      .ld-qa-list { display: flex; flex-direction: column; gap: 0; }
      .ld-qa-row {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 4px 12px; padding: 8px 0;
        border-bottom: 1px solid hsl(var(--border));
        align-items: start;
      }
      .ld-qa-row:last-child { border-bottom: none; }
      .ld-qa-q { font-size: 12px; color: hsl(var(--muted-foreground)); line-height: 1.4; }
      .ld-qa-a { font-size: 13px; font-weight: 600; color: hsl(var(--foreground)); line-height: 1.4; }
      .ld-snap-price-grid {
        display: grid; grid-template-columns: 1fr auto;
        gap: 4px 16px; align-items: center;
      }
      .ld-sp-label { font-size: 12px; color: hsl(var(--muted-foreground)); }
      .ld-sp-val   { font-size: 13px; font-weight: 600; text-align: right; color: hsl(var(--foreground)); }

      .ld-tag { display: inline-block; padding: 2px 10px; border-radius: 20px;
        font-size: 11px; font-weight: 600; background: hsl(var(--primary) / 0.1);
        color: hsl(var(--primary)); margin: 2px; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="main-content">
          <a class="ld-back" href="/clients">&#8592; Back to Clients</a>

          <div id="ldRoot">
            <div class="ld-loading">Loading lead&hellip;</div>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-lead-detail.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
