<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clients • Vickery CRM</title>

  <link rel="stylesheet" href="/pages/css/brand.css" />
  <link rel="stylesheet" href="/pages/css/shell.css" />

  <style>
    /* Client Book (Jobber-ish) */
    .clients-controls {
      display: grid;
      gap: 12px;
      margin-bottom: 18px;
    }

    .client-count {
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
    }

    /* list */
    .client-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .client-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid hsl(var(--border));
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      color: inherit;
      transition: border-color .15s ease, box-shadow .15s ease, transform .08s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .client-row:active {
      transform: translateY(1px);
    }

    .client-row:hover {
      border-color: hsl(var(--primary) / 0.35);
      box-shadow: 0 6px 22px rgba(0,0,0,0.18);
    }

    .client-avatar {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      color: hsl(var(--primary-foreground));
      background: hsl(var(--primary));
      flex: 0 0 42px;
    }

    .client-info {
      flex: 1;
      min-width: 0;
    }

    .client-name {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .client-sub {
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    .client-right {
      flex: 0 0 auto;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid hsl(var(--border));
      background: rgba(255,255,255,0.03);
      font-size: 12px;
      font-weight: 750;
      color: hsl(var(--foreground));
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 8px;
      background: hsl(var(--muted-foreground));
    }

    .dot-blue { background: hsl(var(--accent)); }
    .dot-gray { background: hsl(var(--muted-foreground)); }
    .dot-yellow { background: hsl(40 95% 50%); }
    .dot-red { background: hsl(var(--destructive)); }

    .client-date {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 44px 18px;
      border-radius: 16px;
      border: 1px solid hsl(var(--border));
      background: rgba(255,255,255,0.03);
    }
    .empty-state h2 {
      font-family: var(--font-display);
      margin: 0 0 8px 0;
    }

    @media (max-width: 600px) {
      .client-right { display: none; }
      .client-row { padding: 12px 12px; }
      .client-avatar { width: 38px; height: 38px; flex-basis: 38px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebarMount"></div>

    <main class="main-area">
      <div class="page-header-row">
        <h1>Clients</h1>
        <div id="clientCount" class="client-count"></div>
      </div>

      <div class="main-content">
        <!-- Controls -->
        <div class="form-card" style="margin-bottom:16px; max-width:100%;">
          <div class="form-group" style="margin-bottom:12px;">
            <input
              id="searchInput"
              type="text"
              placeholder="Search clients..."
              autocomplete="off"
            />
          </div>

          <div class="form-group" style="margin-bottom:0;">
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="awaiting_response">Awaiting Response</option>
              <option value="scheduled">Scheduled</option>
              <option value="in_progress">In Progress</option>
              <option value="awaiting_payment">Awaiting Payment</option>
              <option value="overdue">Overdue</option>
            </select>
          </div>
        </div>

        <!-- Client List -->
        <div id="emptyState" class="empty-state" style="display:none;">
          <h2>No leads yet</h2>
          <p style="color:hsl(var(--muted-foreground));margin:0;">Add a lead to see it here.</p>
        </div>
        <div id="clientList" class="client-list"></div>
      </div>
    </main>
  </div>

  <script src="/pages/js/shell.js"></script>
  <script src="/pages/js/clients.js"></script>
  <script src="/pages/js/crm-fab.js"></script>
</body>
</html>
