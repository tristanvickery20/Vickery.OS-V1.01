<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Leads &bull; Vickery CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
    <style>
      .leads-topbar {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 10px;
      }
      .leads-topbar-title { font-size: 20px; font-weight: 800; }

      #gcalSyncBadge {
        display: none; align-items: center; gap: 5px;
        font-size: 12px; font-weight: 600; color: rgba(220,232,255,0.7);
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(100,150,255,0.15);
        border-radius: 20px; padding: 4px 10px;
        text-decoration: none; cursor: pointer;
        transition: background .15s;
      }
      #gcalSyncBadge:hover { background: rgba(255,255,255,0.09); }

      .gcal-lead-dot {
        display: inline-block; font-size: 12px;
        margin-left: 4px; opacity: .75;
        text-decoration: none;
        vertical-align: middle;
      }
      .gcal-lead-dot:hover { opacity: 1; }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vickery CRM" />
</head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <button id="refreshBtn" style="display:none;" type="button">Refresh</button>
        <div class="main-content">
          <div class="leads-topbar">
            <span class="leads-topbar-title">Leads</span>
            <a id="gcalSyncBadge" href="/crm/settings?tab=gcal" title="Google Calendar Sync">
              <span id="gcalSyncDot" style="width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
              <span id="gcalSyncLabel">GCal</span>
            </a>
          </div>
          <p id="status" class="status-text"></p>

          <div class="data-table-wrap">
            <table id="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Created</th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Job Type</th>
                  <th>Deposit?</th>
                  <th>Dep. $ Recv</th>
                  <th>Est. $</th>
                  <th>Status</th>
                  <th>Scheduled</th>
                  <th>Tech</th>
                  <th>Duration (min)</th>
                  <th>Override</th>
                  <th>Inv. $</th>
                  <th>Paid $</th>
                  <th>Inv. Date</th>
                  <th>Paid Date</th>
                  <th>View</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-leads-helpers.js"></script>
    <script src="/pages/js/schedule-suggest.js"></script>
    <script src="/pages/js/crm-leads.js"></script>
    <script src="/pages/js/shell.js"></script>
    <script src="/pages/js/crm-fab.js"></script>

    <script>
      (async function loadGCalBadge() {
        try {
          const r = await fetch("/api/gcal/status");
          if (!r.ok) return;
          const d = await r.json();
          const badge = document.getElementById("gcalSyncBadge");
          const dot   = document.getElementById("gcalSyncDot");
          const lbl   = document.getElementById("gcalSyncLabel");
          if (!badge) return;
          badge.style.display = "flex";
          if (!d.enabled) {
            dot.style.background = "#94a3b8";
            lbl.textContent = "GCal off";
            badge.title = "Google Calendar sync is disabled — click to configure";
          } else if (d.enabled && !d.jobsCalId) {
            dot.style.background = "#ef4444";
            lbl.textContent = "GCal Error";
            badge.title = "Sync enabled but calendars not bootstrapped — click to fix";
          } else {
            dot.style.background = "#4ade80";
            let ago = "";
            if (d.lastSyncAt) {
              const mins = Math.round((Date.now() - new Date(d.lastSyncAt).getTime()) / 60000);
              ago = mins < 2 ? " · just now" : mins < 60 ? ` · ${mins}m ago` : ` · ${Math.round(mins/60)}h ago`;
            }
            lbl.textContent = "GCal ✓" + ago;
            badge.title = d.lastSyncAt
              ? "Last synced: " + new Date(d.lastSyncAt).toLocaleString()
              : "Google Calendar sync active";
          }
        } catch { /* unavailable */ }
      })();
    </script>
  </body>
</html>
