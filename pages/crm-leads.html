<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leads &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="page-header-row">
          <h1>Leads</h1>
          <button id="refreshBtn" class="btn-outline" type="button">Refresh</button>
        </div>
        <div class="main-content">
          <p id="status" class="status-text"></p>

          <div class="data-table-wrap">
            <table id="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Created</th>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Job Type</th>
                  <th>Deposit?</th>
                  <th>Dep. $ Recv</th>
                  <th>Est. $</th>
                  <th>Status</th>
                  <th>Scheduled</th>
                  <th>Tech</th>
                  <th>Duration (min)</th>
                  <th>Override</th>
                  <th>Inv. $</th>
                  <th>Paid $</th>
                  <th>Inv. Date</th>
                  <th>Paid Date</th>
                  <th>View</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-leads-helpers.js"></script>
    <script src="/pages/js/schedule-suggest.js"></script>
    <script src="/pages/js/crm-leads.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
