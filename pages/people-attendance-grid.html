<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Attendance Grid — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .page-header-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      margin-bottom: 20px;
    }
    .toolbar input[type="month"], .toolbar select {
      padding: 8px 12px; background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--text, #e6eefc);
      font-size: 14px; font-family: inherit;
    }
    .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--blue, #2d6ae0); }

    .view-toggle { display: flex; gap: 8px; }
    .view-toggle a {
      padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 700;
      text-decoration: none; color: var(--muted, rgba(220,232,255,0.7));
      border: 1px solid var(--line, rgba(100,150,255,0.14));
    }
    .view-toggle a.active { background: var(--blue, #2d6ae0); color: #fff; border-color: transparent; }

    .legend {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; font-size: 12px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
    .dot-p { background: rgba(34,197,94,0.6); }
    .dot-a { background: rgba(239,68,68,0.5); }
    .dot-l { background: rgba(251,191,36,0.5); }
    .dot-h { background: rgba(139,92,246,0.5); }
    .dot-n { background: rgba(100,150,255,0.08); border: 1px solid rgba(100,150,255,0.15); }

    .grid-wrap { overflow-x: auto; }
    table { border-collapse: collapse; font-size: 12px; }
    thead th {
      padding: 6px 4px; font-size: 11px; font-weight: 700; text-align: center;
      color: var(--muted, rgba(220,232,255,0.6)); white-space: nowrap;
      border-bottom: 1px solid var(--line, rgba(100,150,255,0.14));
    }
    thead th.name-col { text-align: left; padding-left: 0; min-width: 150px; }
    tbody tr { border-bottom: 1px solid rgba(100,150,255,0.05); }
    tbody tr:hover { background: rgba(100,150,255,0.03); }
    tbody td { padding: 4px; vertical-align: middle; }
    .emp-name-cell { font-size: 13px; font-weight: 600; padding: 6px 8px 6px 0; white-space: nowrap; min-width: 150px; }
    .emp-name-sub  { font-size: 11px; color: var(--muted, rgba(220,232,255,0.6)); }

    .cell {
      width: 28px; height: 28px; border-radius: 5px; display: flex;
      align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; cursor: default; margin: 1px;
    }
    .cell-P { background: rgba(34,197,94,0.2);  color: #4ade80; }
    .cell-A { background: rgba(239,68,68,0.15); color: #f87171; }
    .cell-L { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .cell-H { background: rgba(139,92,246,0.15); color: #a78bfa; }
    .cell-  { background: rgba(100,150,255,0.04); color: transparent; }
    .cell-today { outline: 2px solid rgba(45,106,224,0.6); outline-offset: -2px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted, rgba(220,232,255,0.7)); }
    .empty strong { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text, #e6eefc); }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #166534; color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 200;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">

      <div class="page-header-row">
        <h1>Attendance Grid</h1>
        <div class="view-toggle">
          <a href="/people/attendance">Daily</a>
          <a href="/people/attendance/grid" class="active">Monthly Grid</a>
        </div>
      </div>

      <div class="toolbar">
        <input type="month" id="monthPicker" />
        <select id="deptFilter">
          <option value="">All Departments</option>
        </select>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot dot-p"></div>Present</div>
        <div class="legend-item"><div class="legend-dot dot-a"></div>Absent</div>
        <div class="legend-item"><div class="legend-dot dot-l"></div>On Leave</div>
        <div class="legend-item"><div class="legend-dot dot-h"></div>Half Day</div>
        <div class="legend-item"><div class="legend-dot dot-n"></div>Not Recorded</div>
      </div>

      <div class="grid-wrap" id="gridWrap">
        <div class="empty"><strong>Loading…</strong></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-attendance-grid.js"></script>
</body>
</html>
