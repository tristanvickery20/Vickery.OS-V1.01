<script>
  (function() {
    function refreshBadge() {
      fetch("/api/crew/staff/pending-count").then(r => r.json()).then(d => {
        var badge = document.getElementById("staffPendingBadge");
        if (!badge) return;
        if (d.count > 0) { badge.textContent = d.count; badge.style.display = "inline"; }
        else { badge.style.display = "none"; }
      }).catch(function(){});
    }
    refreshBadge();
    setInterval(refreshBadge, 60000);
  })();
</script>
