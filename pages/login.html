<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <style>
      .login-wrap {
        display: flex; align-items: center; justify-content: center;
        min-height: 80vh;
      }
      .login-card {
        background: white;
        border-radius: var(--radius);
        padding: 2.5rem 2.5rem 0;
        box-shadow: 0 4px 32px hsla(220,60%,20%,0.14);
        width: 100%; max-width: 380px;
        text-align: center;
        overflow: hidden;
      }
      .login-card h1 { font-family: var(--font-display); margin-bottom: 0.5rem; }
      .login-card p { color: hsl(var(--muted-foreground)); margin-bottom: 1.5rem; font-size: 0.9rem; }
      .login-card input {
        width: 100%; padding: 0.75rem 1rem; border: 1px solid hsl(var(--border));
        border-radius: var(--radius); font-size: 1.1rem; text-align: center;
        letter-spacing: 0.2em; margin-bottom: 1rem;
      }
      .login-card input:focus { outline: none; border-color: hsl(var(--accent)); box-shadow: 0 0 0 3px hsla(var(--ring),0.15); }
      .login-card button {
        width: 100%; padding: 0.75rem; border: none; border-radius: var(--radius);
        font-size: 1rem; font-weight: 600; cursor: pointer;
      }
      .login-error {
        color: hsl(var(--destructive)); font-size: 0.85rem; margin-top: 0.5rem;
        min-height: 1.2em; margin-bottom: 1.5rem;
      }
      .login-logo { display: none; }

      /* ── Electric staff strip at the bottom ─────────────────────────────── */
      .login-staff {
        margin: 0 -2.5rem;
        height: 96px;
        background: #060c20;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-staff img {
        height: 420px;
        width: auto;
        max-width: none;
        flex-shrink: 0;
        transform: rotate(90deg);
        mix-blend-mode: screen;
        opacity: 0.92;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <img src="/pages/img/logo.jpg" alt="Vickery Electric" class="logo-img logo-img-lg">
        <h1>CRM Login</h1>
        <p>Enter your PIN to access the portal.</p>
        <form id="loginForm">
          <input id="pin" type="password" placeholder="PIN" autocomplete="off" autofocus />
          <button type="submit" class="nav-btn" style="width:100%;padding:0.75rem;border-radius:var(--radius);font-size:1rem;font-weight:600;">Login</button>
        </form>
        <div id="error" class="login-error"></div>

        <div class="login-staff">
          <img src="/pages/img/staff.png" alt="">
        </div>
      </div>
    </div>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pin = document.getElementById("pin").value;
        const errEl = document.getElementById("error");
        errEl.textContent = "";
        try {
          const resp = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin }),
          });
          const data = await resp.json();
          if (data.ok) { window.location.href = data.redirect || "/clients"; return; }
          errEl.textContent = data.error || "Invalid PIN.";
        } catch (err) {
          errEl.textContent = "Connection error.";
        }
      });
    </script>
  </body>
</html>
