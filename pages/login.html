<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <style>
      .login-wrap {
        display: flex; align-items: center; justify-content: center;
        min-height: 80vh;
      }
      .login-card {
        background: white; border-radius: var(--radius); padding: 2.5rem;
        box-shadow: 0 4px 24px hsla(220,60%,20%,0.10);
        width: 100%; max-width: 380px; text-align: center;
      }
      .login-card h1 { font-family: var(--font-display); margin-bottom: 0.5rem; }
      .login-card p { color: hsl(var(--muted-foreground)); margin-bottom: 1.5rem; font-size: 0.9rem; }
      .login-card input {
        width: 100%; padding: 0.75rem 1rem; border: 1px solid hsl(var(--border));
        border-radius: var(--radius); font-size: 1.1rem; text-align: center;
        letter-spacing: 0.2em; margin-bottom: 1rem;
      }
      .login-card input:focus { outline: none; border-color: hsl(var(--accent)); box-shadow: 0 0 0 3px hsla(var(--ring),0.15); }
      .login-card button {
        width: 100%; padding: 0.75rem; background: hsl(var(--primary));
        color: hsl(var(--primary-foreground)); border: none; border-radius: var(--radius);
        font-size: 1rem; font-weight: 600; cursor: pointer;
      }
      .login-card button:hover { opacity: 0.9; }
      .login-error {
        color: hsl(var(--destructive)); font-size: 0.85rem; margin-top: 0.75rem;
        min-height: 1.2em;
      }
      .login-logo{display:none}
    </style>
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="ve-logo ve-logo-lg"><svg class="ve-logo-bolt" width="14" height="22" viewBox="0 0 14 22" aria-hidden="true"><polygon points="8,0 1,12 6,12 4,22 13,10 8,10" fill="currentColor"/></svg><div class="ve-logo-text"><span class="ve-logo-name">VICKERY</span><span class="ve-logo-sub">ELECTRIC</span></div></div>
        <h1>CRM Login</h1>
        <p>Enter your PIN to access the portal.</p>
        <form id="loginForm">
          <input id="pin" type="password" placeholder="PIN" autocomplete="off" autofocus />
          <button type="submit">Login</button>
        </form>
        <div id="error" class="login-error"></div>
      </div>
    </div>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pin = document.getElementById("pin").value;
        const errEl = document.getElementById("error");
        errEl.textContent = "";
        try {
          const resp = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ pin }),
          });
          const data = await resp.json();
          if (data.ok) { window.location.href = data.redirect || "/clients"; return; }
          errEl.textContent = data.error || "Invalid PIN.";
        } catch (err) {
          errEl.textContent = "Connection error.";
        }
      });
    </script>
  </body>
</html>
