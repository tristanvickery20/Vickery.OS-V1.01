<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Vickery Electric — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: 217 91% 60%;
      --primary-dark: 217 91% 52%;
      --bg: hsl(220 14% 7%);
      --surface: hsl(220 12% 11%);
      --surface2: hsl(220 10% 15%);
      --border: hsl(220 10% 22%);
      --text: hsl(220 15% 88%);
      --muted: hsl(220 12% 52%);
      --danger: hsl(0 65% 58%);
      --success: hsl(142 55% 42%);
    }

    body {
      font-family: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      width: 148px;
      height: auto;
      display: block;
      margin: 0 auto 12px;
      opacity: 0.92;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .04em;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px 32px;
    }

    .tabs {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
    }
    .tab-btn.active {
      background: hsl(var(--primary));
      color: #fff;
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .form-input {
      width: 100%;
      background: hsl(220 10% 9%);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      padding: 14px 14px;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    .form-input:focus {
      outline: none;
      border-color: hsl(var(--primary));
    }
    .form-input[readonly] {
      color: var(--muted);
      cursor: default;
    }
    .form-input.error { border-color: var(--danger); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: hsl(var(--primary));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity .15s, background .15s;
      letter-spacing: .01em;
    }
    .btn-submit:hover { background: hsl(var(--primary-dark)); }
    .btn-submit:active { opacity: .85; }
    .btn-submit:disabled { opacity: .45; cursor: not-allowed; }

    .alert {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    .alert.error   { background: hsl(0 60% 15%);   border: 1px solid hsl(0 55% 30%);   color: hsl(0 80% 75%);   display: block; }
    .alert.success { background: hsl(142 40% 12%); border: 1px solid hsl(142 40% 25%); color: hsl(142 65% 60%); display: block; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="brand">
  <img src="/pages/img/ve-logo-blue.png" alt="Vickery Electric" class="brand-logo">
  <div class="brand-title">Sign In</div>
</div>

<div class="card">
  <div class="tabs">
    <button class="tab-btn active" data-tab="login">Sign In</button>
    <button class="tab-btn" data-tab="signup">Create Account</button>
  </div>

  <!-- Sign In -->
  <div class="form-panel active" id="panel-login">
    <div class="alert" id="login-alert"></div>
    <form id="loginForm" autocomplete="on" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="login-username">Username</label>
        <input class="form-input" id="login-username" type="text"
          autocomplete="username" placeholder="first.last" />
      </div>
      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input class="form-input" id="login-password" type="password"
          autocomplete="current-password" placeholder="Your password" />
      </div>
      <button class="btn-submit" id="btn-login" type="submit">Sign In</button>
    </form>
  </div>

  <!-- Create Account -->
  <div class="form-panel" id="panel-signup">
    <div class="alert" id="signup-alert"></div>
    <form id="signupForm" autocomplete="on" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="signup-first">First Name</label>
          <input class="form-input" id="signup-first" type="text"
            autocomplete="given-name" placeholder="Tristan" />
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-last">Last Name</label>
          <input class="form-input" id="signup-last" type="text"
            autocomplete="family-name" placeholder="Vickery" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-username">Username</label>
        <input class="form-input" id="signup-username" type="text"
          autocomplete="username" readonly placeholder="auto-generated" />
        <div class="hint">Auto-generated from your name — cannot be changed.</div>
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <input class="form-input" id="signup-password" type="password"
          autocomplete="new-password" placeholder="At least 6 characters" />
      </div>
      <div class="form-group">
        <label class="form-label" for="signup-confirm">Confirm Password</label>
        <input class="form-input" id="signup-confirm" type="password"
          autocomplete="new-password" placeholder="Same password again" />
      </div>
      <button class="btn-submit" id="btn-signup" type="submit">Create Account</button>
      <div class="hint" style="text-align:center;margin-top:14px;">
        Your request will be reviewed and approved by the owner.
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  // Check if already authenticated
  (async function checkSession() {
    try {
      const res = await fetch("/api/crew/me");
      const d = await res.json();
      if (d.ok) {
        window.location.replace(d.staff?.role === "owner" ? "/clients" : "/crew");
      }
    } catch {}
  })();

  // Tab switching
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".form-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + tab)?.classList.add("active");
      clearAlerts();
    });
  });

  function clearAlerts() {
    document.querySelectorAll(".alert").forEach(el => { el.className = "alert"; el.textContent = ""; });
  }

  function showAlert(id, message, type) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = message;
    el.className = "alert " + (type || "error");
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function setLoading(btnId, loading) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    if (loading) {
      btn.dataset.origText = btn.innerHTML;
      btn.innerHTML = "<span class=\"spinner\"></span> Please wait\u2026";
      btn.disabled = true;
    } else {
      btn.innerHTML = btn.dataset.origText || btn.innerHTML;
      btn.disabled = false;
    }
  }

  // Auto-generate username from name
  function toUsername(first, last) {
    var f = first.toLowerCase().replace(/[^a-z0-9]/g, "");
    var l = last.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!f && !l) return "";
    if (!l) return f;
    if (!f) return l;
    return f + "." + l;
  }

  function updateUsername() {
    var first = (document.getElementById("signup-first")?.value || "").trim();
    var last  = (document.getElementById("signup-last")?.value  || "").trim();
    var el    = document.getElementById("signup-username");
    if (el) el.value = toUsername(first, last);
  }

  document.getElementById("signup-first")?.addEventListener("input", updateUsername);
  document.getElementById("signup-last")?.addEventListener("input", updateUsername);

  // Login
  document.getElementById("btn-login")?.addEventListener("click", doLogin);
  document.getElementById("loginForm")?.addEventListener("submit", function(e) { e.preventDefault(); doLogin(); });
  document.getElementById("login-password")?.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doLogin();
  });

  async function doLogin() {
    clearAlerts();
    var username = (document.getElementById("login-username")?.value || "").trim();
    var password = document.getElementById("login-password")?.value;
    if (!username || !password) {
      return showAlert("login-alert", "Please enter your username and password.");
    }
    setLoading("btn-login", true);
    try {
      var res  = await fetch("/api/crew/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password }),
      });
      var data = await res.json();
      if (data.ok) {
        window.location.replace(data.redirect || "/crew");
      } else {
        showAlert("login-alert", data.error || "Login failed.");
      }
    } catch {
      showAlert("login-alert", "Network error. Please check your connection and try again.");
    }
    setLoading("btn-login", false);
  }

  // Signup
  document.getElementById("btn-signup")?.addEventListener("click", doSignup);
  document.getElementById("signupForm")?.addEventListener("submit", function(e) { e.preventDefault(); doSignup(); });
  document.getElementById("signup-confirm")?.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doSignup();
  });

  async function doSignup() {
    clearAlerts();
    var first_name = (document.getElementById("signup-first")?.value || "").trim();
    var last_name  = (document.getElementById("signup-last")?.value  || "").trim();
    var password   = document.getElementById("signup-password")?.value;
    var confirm    = document.getElementById("signup-confirm")?.value;
    if (!first_name || !last_name || !password || !confirm) {
      return showAlert("signup-alert", "All fields are required.");
    }
    if (password.length < 6) {
      return showAlert("signup-alert", "Password must be at least 6 characters.");
    }
    if (password !== confirm) {
      return showAlert("signup-alert", "Passwords do not match.");
    }
    setLoading("btn-signup", true);
    try {
      var res  = await fetch("/api/crew/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ first_name: first_name, last_name: last_name, password: password }),
      });
      var data = await res.json();
      if (data.ok) {
        if (data.isOwner) {
          showAlert("signup-alert", "Owner account created! Signing you in\u2026", "success");
          setTimeout(function() { window.location.replace("/login"); }, 1200);
        } else {
          showAlert("signup-alert", data.message || "Account request submitted! You\u2019ll receive a text when it\u2019s approved.", "success");
          ["signup-first","signup-last","signup-password","signup-confirm"].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.value = "";
          });
          document.getElementById("signup-username").value = "";
        }
      } else {
        showAlert("signup-alert", data.error || "Signup failed.");
      }
    } catch {
      showAlert("signup-alert", "Network error. Please try again.");
    }
    setLoading("btn-signup", false);
  }
})();
</script>
</body>
</html>
