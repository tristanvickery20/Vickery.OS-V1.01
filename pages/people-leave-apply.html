<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Request Leave — Vickery Electric</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body, system-ui, sans-serif);
      background: hsl(220 14% 8%);
      color: hsl(220 15% 88%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page { width: 100%; max-width: 480px; padding: 0 16px 40px; }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 0 16px; border-bottom: 1px solid hsl(220 10% 18%); margin-bottom: 24px;
    }
    .header-title { font-size: 18px; font-weight: 800; color: hsl(220 15% 92%); }
    .back-link {
      color: hsl(220 15% 55%); text-decoration: none; font-size: 14px; font-weight: 600;
    }
    .back-link:active { opacity: .7; }

    /* ── Cards ── */
    .card {
      background: hsl(220 20% 13%); border: 1px solid hsl(220 15% 20%);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      color: hsl(220 15% 50%); margin-bottom: 14px;
    }

    /* ── Form fields ── */
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-row:last-child { margin-bottom: 0; }
    label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: hsl(220 15% 50%); }
    select, input[type="date"], textarea {
      width: 100%; padding: 12px 14px; background: hsl(220 20% 10%);
      border: 1px solid hsl(220 15% 20%); border-radius: 12px;
      color: hsl(220 15% 88%); font-size: 15px; font-family: inherit;
      -webkit-appearance: none;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: hsl(220 80% 56%); }
    textarea { min-height: 80px; resize: none; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-top: 1px solid hsl(220 15% 18%); margin-top: 4px;
    }
    .toggle-label { font-size: 15px; color: hsl(220 15% 80%); }
    .toggle-switch { position: relative; width: 44px; height: 26px; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-knob {
      position: absolute; inset: 0; background: hsl(220 10% 25%); border-radius: 13px;
      cursor: pointer; transition: background .2s;
    }
    .toggle-knob::before {
      content: ""; position: absolute; left: 3px; top: 3px;
      width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform .2s;
    }
    .toggle-switch input:checked + .toggle-knob { background: hsl(220 80% 56%); }
    .toggle-switch input:checked + .toggle-knob::before { transform: translateX(18px); }

    /* ── Balance pill ── */
    .balance-info {
      display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px;
    }
    .balance-pill {
      background: hsl(220 20% 16%); border: 1px solid hsl(220 15% 22%);
      border-radius: 99px; padding: 4px 14px; font-size: 13px; color: hsl(220 15% 70%);
    }
    .balance-pill strong { color: hsl(220 15% 92%); }

    /* ── Days preview ── */
    .days-preview {
      margin-top: 8px; padding: 10px 14px; border-radius: 10px;
      background: hsl(220 80% 20%); border: 1px solid hsl(220 60% 35%);
      font-size: 14px; color: hsl(220 15% 85%); display: none;
    }
    .days-preview.visible { display: block; }
    .days-preview.warn { background: hsl(0 40% 18%); border-color: hsl(0 60% 40%); }

    /* ── Submit button ── */
    .submit-btn {
      width: 100%; padding: 16px; background: hsl(220 80% 56%); color: #fff;
      border: none; border-radius: 14px; font-size: 16px; font-weight: 800;
      cursor: pointer; font-family: inherit; margin-top: 8px;
      transition: opacity .15s;
    }
    .submit-btn:active { opacity: .8; }
    .submit-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Balance table ── */
    .bal-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid hsl(220 15% 18%); font-size: 14px; }
    .bal-row:first-child { border-top: none; }
    .bal-name { color: hsl(220 15% 80%); }
    .bal-val { color: hsl(220 15% 92%); font-weight: 700; }

    /* ── My Applications ── */
    .app-item { padding: 12px 0; border-top: 1px solid hsl(220 15% 18%); }
    .app-item:first-child { border-top: none; }
    .app-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .app-name { font-size: 14px; font-weight: 700; color: hsl(220 15% 88%); }
    .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    .badge-pending  { background: rgba(234,179,8,0.15); color: #fde047; }
    .badge-approved { background: rgba(34,197,94,0.13); color: #4ade80; }
    .badge-rejected { background: rgba(239,68,68,0.13); color: #f87171; }
    .app-meta { font-size: 13px; color: hsl(220 15% 55%); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #166534; color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 200;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #7f1d1d; }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <a class="back-link" href="/people/leave">← Back</a>
    <div class="header-title">Request Leave</div>
    <div></div>
  </div>

  <!-- Leave request form -->
  <div class="card">
    <div class="card-title">New Leave Application</div>
    <div class="form-row">
      <label>Employee</label>
      <select id="empSel">
        <option value="">Select…</option>
      </select>
    </div>
    <div class="form-row">
      <label>Leave Type</label>
      <select id="ltSel">
        <option value="">Select…</option>
      </select>
    </div>
    <div id="balanceInfo" class="balance-info" style="margin-bottom:10px;"></div>
    <div class="two-col">
      <div class="form-row">
        <label>From</label>
        <input type="date" id="fromDate" />
      </div>
      <div class="form-row">
        <label>To</label>
        <input type="date" id="toDate" />
      </div>
    </div>
    <div id="daysPreview" class="days-preview"></div>
    <div class="toggle-row">
      <div class="toggle-label">Half Day</div>
      <label class="toggle-switch">
        <input type="checkbox" id="halfDayToggle" />
        <span class="toggle-knob"></span>
      </label>
    </div>
    <div class="form-row" style="margin-top:14px;">
      <label>Reason</label>
      <textarea id="reasonInput" placeholder="Optional reason…"></textarea>
    </div>
    <button class="submit-btn" id="submitBtn">Submit Application</button>
  </div>

  <!-- Leave balances -->
  <div class="card">
    <div class="card-title">Your Balances</div>
    <div id="balancesSection"><div style="color:hsl(220 15% 50%);font-size:14px;">Select an employee to view balances.</div></div>
  </div>

  <!-- My applications -->
  <div class="card">
    <div class="card-title">My Applications</div>
    <div id="myApps"><div style="color:hsl(220 15% 50%);font-size:14px;">Select an employee to view applications.</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/pages/js/people-leave-apply.js"></script>
</body>
</html>
