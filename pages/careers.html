<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Careers — Vickery Electric</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a1628; color: #e6eefc; min-height: 100vh;
    }
    .site-header {
      background: #060e1e; border-bottom: 1px solid rgba(100,150,255,0.12);
      padding: 16px 24px; display: flex; align-items: center; gap: 16px;
    }
    .brand { font-size: 18px; font-weight: 800; color: #e6eefc; text-decoration: none; }
    .hero {
      background: linear-gradient(135deg, #0d1f3c 0%, #0a1628 100%);
      padding: 60px 24px; text-align: center;
      border-bottom: 1px solid rgba(100,150,255,0.1);
    }
    .hero h1 { font-size: clamp(26px, 4vw, 42px); font-weight: 900; margin-bottom: 12px; }
    .hero p { font-size: 16px; color: rgba(220,232,255,0.7); max-width: 520px; margin: 0 auto; }

    .container { max-width: 780px; margin: 0 auto; padding: 40px 20px; }

    .openings-title {
      font-size: 18px; font-weight: 800; margin-bottom: 20px;
    }

    .opening-card {
      background: #101e45; border: 1px solid rgba(100,150,255,0.14);
      border-radius: 16px; padding: 22px 24px; margin-bottom: 14px;
    }
    .opening-card:hover { border-color: rgba(100,150,255,0.3); }
    .opening-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .opening-meta {
      font-size: 13px; color: rgba(220,232,255,0.6);
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .opening-desc { font-size: 14px; color: rgba(220,232,255,0.75); margin-bottom: 16px; white-space: pre-line; }
    .btn-apply {
      display: inline-block; padding: 10px 22px;
      background: #2d6ae0; color: #fff; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-apply:hover { opacity: .88; }

    .no-openings {
      text-align: center; padding: 60px 20px;
      color: rgba(220,232,255,0.4); font-size: 16px;
    }

    /* Application Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.7); z-index: 1000;
      align-items: flex-start; justify-content: center;
      padding: 40px 16px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #101e45; border: 1px solid rgba(100,150,255,0.2);
      border-radius: 18px; padding: 32px; width: 100%; max-width: 520px;
    }
    .modal h2 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .modal-job-title { font-size: 14px; color: rgba(220,232,255,0.6); margin-bottom: 24px; }
    .form-row { margin-bottom: 16px; }
    .form-row label {
      display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px;
      color: rgba(220,232,255,0.6); text-transform: uppercase; letter-spacing: .04em;
    }
    .form-input, .form-select {
      width: 100%; padding: 11px 14px;
      background: #0a1628; border: 1px solid rgba(100,150,255,0.14);
      border-radius: 10px; color: #e6eefc; font-size: 14px; font-family: inherit;
    }
    .form-input:focus, .form-select:focus { outline: none; border-color: #2d6ae0; }
    .file-label {
      display: block; padding: 11px 14px;
      background: #0a1628; border: 1px dashed rgba(100,150,255,0.3);
      border-radius: 10px; color: rgba(220,232,255,0.6); font-size: 14px;
      cursor: pointer; text-align: center; transition: border-color .15s;
    }
    .file-label:hover { border-color: rgba(100,150,255,0.6); color: #e6eefc; }
    .file-input { display: none; }
    .file-chosen { font-size: 12px; color: rgba(220,232,255,0.5); margin-top: 6px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .btn-cancel {
      padding: 10px 18px; background: transparent;
      border: 1px solid rgba(100,150,255,0.2); border-radius: 10px;
      color: rgba(220,232,255,0.7); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .msg-success {
      background: hsl(140 50% 15%); border: 1px solid hsl(140 50% 30%);
      border-radius: 12px; padding: 20px; text-align: center; font-size: 15px;
      color: hsl(140 70% 72%); display: none;
    }
    .msg-error {
      color: hsl(0 70% 65%); font-size: 13px; margin-top: 12px; text-align: center; display: none;
    }
    .loading { opacity: .5; pointer-events: none; }
  </style>
</head>
<body>
<header class="site-header">
  <a href="/" class="brand">⚡ Vickery Electric</a>
</header>

<div class="hero">
  <h1>Join Our Team</h1>
  <p>We're looking for talented people to help power homes and businesses across the region. Browse our open positions below.</p>
</div>

<div class="container">
  <div class="openings-title">Open Positions</div>
  <div id="openingsList">
    <div class="no-openings">Loading...</div>
  </div>
</div>

<!-- Apply Modal -->
<div class="modal-overlay" id="applyModal">
  <div class="modal">
    <h2>Apply Now</h2>
    <div class="modal-job-title" id="modalJobTitle"></div>
    <input type="hidden" id="applyOpeningId" />

    <div id="applyForm">
      <div class="form-row">
        <label>Full Name *</label>
        <input class="form-input" id="aName" placeholder="Jane Smith" />
      </div>
      <div class="form-row">
        <label>Email Address *</label>
        <input class="form-input" id="aEmail" type="email" placeholder="jane@example.com" />
      </div>
      <div class="form-row">
        <label>Phone</label>
        <input class="form-input" id="aPhone" type="tel" placeholder="(555) 000-0000" />
      </div>
      <div class="form-row">
        <label>How did you hear about us?</label>
        <select class="form-select" id="aSource">
          <option value="Website">Website</option>
          <option value="Referral">Referral</option>
          <option value="Walk-in">Walk-in</option>
          <option value="LinkedIn">LinkedIn</option>
          <option value="Indeed">Indeed</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Resume / CV (PDF, DOC — optional)</label>
        <label class="file-label" for="aResume">
          <span id="fileLabelText">Click to attach your resume</span>
        </label>
        <input class="file-input" type="file" id="aResume" accept=".pdf,.doc,.docx,.txt,.rtf"
               onchange="handleFileSelect(this)" />
        <div class="file-chosen" id="fileChosen"></div>
      </div>
      <div class="msg-error" id="applyError"></div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeApplyModal()">Cancel</button>
        <button class="btn-apply" onclick="submitApplication()">Submit Application</button>
      </div>
    </div>

    <div class="msg-success" id="applySuccess">
      <div style="font-size:32px;margin-bottom:10px">🎉</div>
      <strong>Application submitted!</strong><br/>
      <span style="color:rgba(220,232,255,0.7);font-size:13px;margin-top:6px;display:block">
        We'll review your application and be in touch soon.
      </span>
    </div>
  </div>
</div>

<script>
  let openings = [];

  async function loadOpenings() {
    const list = document.getElementById("openingsList");
    try {
      const r = await fetch("/api/public/jobs");
      const d = await r.json();
      openings = d.openings || [];
      if (!openings.length) {
        list.innerHTML = '<div class="no-openings">No open positions at this time. Check back soon!</div>';
        return;
      }
      list.innerHTML = openings.map(o => `
        <div class="opening-card">
          <div class="opening-title">${esc(o.title)}</div>
          <div class="opening-meta">
            ${o.department_name ? `<span>🏢 ${esc(o.department_name)}</span>` : ""}
            ${o.designation_name ? `<span>👤 ${esc(o.designation_name)}</span>` : ""}
            <span>📅 Posted ${fmt(o.posted_date)}</span>
          </div>
          ${o.description ? `<div class="opening-desc">${esc(o.description)}</div>` : ""}
          <button class="btn-apply" data-id="${esc(o.opening_id)}" data-title="${esc(o.title)}">Apply Now</button>
        </div>
      `).join("");
    } catch {
      list.innerHTML = '<div class="no-openings">Unable to load positions. Please try again later.</div>';
    }
  }

  function fmt(d) {
    if (!d) return "";
    try { return new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); }
    catch { return d; }
  }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  let selectedFile = null;

  // Delegated click handler: avoids inline onclick with un-escaped quotes
  document.getElementById("openingsList").addEventListener("click", function(e) {
    const btn = e.target.closest(".btn-apply");
    if (btn) openApplyModal(btn.dataset.id, btn.dataset.title);
  });

  function openApplyModal(openingId, title) {
    selectedFile = null;
    document.getElementById("applyOpeningId").value = openingId;
    document.getElementById("modalJobTitle").textContent = title;
    document.getElementById("applyForm").style.display = "block";
    document.getElementById("applySuccess").style.display = "none";
    document.getElementById("applyError").style.display = "none";
    document.getElementById("aName").value = "";
    document.getElementById("aEmail").value = "";
    document.getElementById("aPhone").value = "";
    document.getElementById("aSource").value = "Website";
    document.getElementById("aResume").value = "";
    document.getElementById("fileChosen").textContent = "";
    document.getElementById("fileLabelText").textContent = "Click to attach your resume";
    document.getElementById("applyModal").classList.add("open");
  }

  function closeApplyModal() {
    document.getElementById("applyModal").classList.remove("open");
  }

  function handleFileSelect(input) {
    selectedFile = input.files[0] || null;
    if (selectedFile) {
      document.getElementById("fileChosen").textContent = selectedFile.name;
      document.getElementById("fileLabelText").textContent = "Change file";
    }
  }

  async function submitApplication() {
    const openingId = document.getElementById("applyOpeningId").value;
    const name  = document.getElementById("aName").value.trim();
    const email = document.getElementById("aEmail").value.trim();
    const phone = document.getElementById("aPhone").value.trim();
    const source= document.getElementById("aSource").value;
    const errEl = document.getElementById("applyError");

    if (!name || !email) {
      errEl.textContent = "Name and email are required.";
      errEl.style.display = "block";
      return;
    }
    errEl.style.display = "none";

    let resume_data = null, resume_name = null;
    if (selectedFile) {
      try {
        resume_data = await toBase64(selectedFile);
        resume_name = selectedFile.name;
      } catch { /* ignore upload errors */ }
    }

    const btn = document.querySelector("#applyForm .btn-apply");
    btn.textContent = "Submitting…";
    btn.classList.add("loading");

    try {
      const r = await fetch("/api/public/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ opening_id: openingId, name, email, phone, source, resume_data, resume_name }),
      });
      const d = await r.json();
      if (d.ok) {
        document.getElementById("applyForm").style.display = "none";
        const successEl = document.getElementById("applySuccess");
        if (d.resume_warning) {
          const warnEl = successEl.querySelector(".resume-warn") || Object.assign(document.createElement("p"), { className: "resume-warn" });
          warnEl.style.cssText = "color:#f0a000;font-size:12px;margin-top:8px;";
          warnEl.textContent = d.resume_warning;
          successEl.appendChild(warnEl);
        }
        successEl.style.display = "block";
      } else {
        errEl.textContent = d.error || "Submission failed. Please try again.";
        errEl.style.display = "block";
      }
    } catch {
      errEl.textContent = "Network error. Please try again.";
      errEl.style.display = "block";
    } finally {
      btn.textContent = "Submit Application";
      btn.classList.remove("loading");
    }
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  document.getElementById("applyModal").addEventListener("click", e => {
    if (e.target === e.currentTarget) closeApplyModal();
  });

  loadOpenings();
</script>
</body>
</html>
