<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marketing Settings &bull; Vickery CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/marketing.css" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vickery CRM" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar" id="sidebarMount"></div>
    <main class="main-area">
      <div class="main-content">

        <div class="page-header">
          <div class="page-title">Marketing Settings</div>
        </div>

        <div id="mktSettingsLoading" class="loading-state">Loading settings…</div>
        <div id="mktSettingsContent" style="display:none;">
          <div class="form-group" style="max-width:520px;margin-bottom:14px;">
            <label class="form-label">Google Review Link</label>
            <input id="mktGoogleReviewUrl" type="url" placeholder="https://g.page/r/…/review" style="width:100%;" />
            <p style="font-size:11px;color:hsl(var(--text-2,220 15% 55%));margin-top:4px;">Paste your Google review shortlink — included in review-ask SMS messages.</p>
          </div>
          <div class="form-group" style="max-width:220px;margin-bottom:20px;">
            <label class="form-label">High-Value Lead Threshold ($)</label>
            <input id="mktHvThreshold" type="number" min="0" step="50" placeholder="1000" style="width:100%;" />
            <p style="font-size:11px;color:hsl(var(--text-2,220 15% 55%));margin-top:4px;">Jobs at or above this amount appear in the High Value smart list.</p>
          </div>
          <button id="mktSettingsSaveBtn" type="button" class="btn-save">Save Settings</button>
          <p id="mktSettingsResult" style="font-size:12px;margin-top:10px;"></p>
        </div>

      </div>
    </main>
  </div>
  <script src="/pages/js/api.js"></script>
  <script src="/pages/js/crm-marketing.js"></script>
  <script src="/pages/js/shell.js"></script>
  <script>
    Mkt.loadMktSettings();
  </script>
</body>
</html>
