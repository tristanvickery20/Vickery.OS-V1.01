<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Payroll Settings — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin:0; font-size:22px; font-weight:800; }
    .page-header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .settings-card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; max-width:560px; }
    .form-row { margin-bottom:18px; }
    .form-row label { display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    .form-row select, .form-row input { width:100%; box-sizing:border-box; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; }
    .form-row select:focus, .form-row input:focus { outline:none; border-color:var(--blue); }
    .form-row .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .btn-primary { padding:11px 24px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-primary:hover { opacity:.88; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:#166534; color:#fff; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:700; opacity:0; transition:all .25s; z-index:200; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { background:#7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">
      <div class="page-header-row">
        <h1>Payroll Settings</h1>
      </div>
      <div class="settings-card">
        <div class="form-row">
          <label>Working Day Source</label>
          <select id="workingDaySource">
            <option value="attendance">Attendance Records</option>
            <option value="calendar">Calendar Weekdays</option>
          </select>
          <div class="hint">How to count working days in a pay period.</div>
        </div>
        <div class="form-row">
          <label>Holiday Handling</label>
          <select id="holidayHandling">
            <option value="exclude">Exclude holidays from working days</option>
            <option value="include">Include holidays as working days</option>
          </select>
        </div>
        <div class="form-row">
          <label>Half-Day Pay Fraction</label>
          <input type="number" id="halfDayFraction" value="0.5" min="0" max="1" step="0.01" />
          <div class="hint">Fraction of a full day's pay for half-day attendance (0.5 = 50%).</div>
        </div>
        <div class="form-row">
          <label>Pay Period Type</label>
          <select id="payPeriodType">
            <option value="monthly">Monthly</option>
            <option value="biweekly">Bi-Weekly</option>
            <option value="weekly">Weekly</option>
          </select>
        </div>
        <button class="btn-primary" id="saveBtn">Save Settings</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-payroll-settings.js"></script>
</body>
</html>
