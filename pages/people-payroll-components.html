<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salary Components — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin:0; font-size:22px; font-weight:800; }
    .page-header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .btn-primary { padding:10px 20px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-primary:hover { opacity:.88; }
    .section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:20px 0 10px; }
    .comp-list { display:flex; flex-direction:column; gap:10px; }
    .comp-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .comp-info { flex:1; min-width:0; }
    .comp-name { font-size:15px; font-weight:700; }
    .comp-meta { font-size:12px; color:var(--muted); margin-top:3px; }
    .comp-actions { display:flex; gap:8px; }
    .btn-icon { padding:6px 13px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:inherit; }
    .btn-icon:hover { color:var(--text); border-color:rgba(100,150,255,.3); }
    .btn-del { color:#f87171; border-color:rgba(239,68,68,.2); }
    .btn-del:hover { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.4); }
    .empty { text-align:center; padding:40px 20px; color:var(--muted); }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
    .modal-backdrop.open { display:flex; }
    .modal { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px; width:100%; max-width:460px; margin:20px; }
    .modal h2 { margin:0 0 20px; font-size:18px; font-weight:800; }
    .form-row { margin-bottom:14px; }
    .form-row label { display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    .form-row input, .form-row select { width:100%; box-sizing:border-box; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; }
    .form-row input:focus, .form-row select:focus { outline:none; border-color:var(--blue); }
    .form-row-inline { display:flex; gap:12px; }
    .form-row-inline .form-row { flex:1; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .btn-secondary { padding:10px 18px; background:transparent; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:#166534; color:#fff; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:700; opacity:0; transition:all .25s; z-index:200; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { background:#7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">
      <div class="page-header-row">
        <h1>Salary Components</h1>
        <button class="btn-primary" id="addBtn">+ New Component</button>
      </div>
      <div class="section-title">Earnings</div>
      <div class="comp-list" id="earningsList"></div>
      <div class="section-title" style="margin-top:28px">Deductions</div>
      <div class="comp-list" id="deductionsList"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Component</h2>
    <input type="hidden" id="editId" />
    <div class="form-row">
      <label>Name *</label>
      <input type="text" id="fieldName" placeholder="e.g. Overtime Pay" />
    </div>
    <div class="form-row-inline">
      <div class="form-row">
        <label>Type</label>
        <select id="fieldType">
          <option value="Earning">Earning</option>
          <option value="Deduction">Deduction</option>
        </select>
      </div>
      <div class="form-row">
        <label>Value Type</label>
        <select id="fieldValueType">
          <option value="Fixed">Fixed Amount</option>
          <option value="Formula">Formula</option>
        </select>
      </div>
    </div>
    <div class="form-row" id="amountRow">
      <label>Fixed Amount ($)</label>
      <input type="number" id="fieldAmount" placeholder="0.00" min="0" step="0.01" />
    </div>
    <div class="form-row" id="formulaRow" style="display:none">
      <label>Formula (use "base" for base pay)</label>
      <input type="text" id="fieldFormula" placeholder="e.g. base * 0.15" />
    </div>
    <div class="form-row">
      <label>Taxable</label>
      <select id="fieldTaxable">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-payroll-components.js"></script>
</body>
</html>
