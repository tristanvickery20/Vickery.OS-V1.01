<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time Tracking &bull; Vickery CRM</title>
    <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
    <style>
      .page-title { font-size: 22px; font-weight: 800; margin-bottom: 20px; }

      .time-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(100,150,255,0.12);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
      }
      .time-card-title {
        font-size: 13px; font-weight: 700; letter-spacing: .07em;
        text-transform: uppercase; color: rgba(220,232,255,0.55);
        margin-bottom: 16px;
      }

      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }

      .form-group { display: flex; flex-direction: column; gap: 5px; }
      .form-label { font-size: 12px; font-weight: 600; color: rgba(220,232,255,0.6); text-transform: uppercase; letter-spacing: .06em; }

      .form-input, .form-select {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(100,150,255,0.18);
        border-radius: 10px;
        color: #e6eefc;
        font-size: 14px;
        font-family: inherit;
        padding: 10px 12px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        transition: border-color .15s;
        -webkit-appearance: none;
      }
      .form-input:focus, .form-select:focus { border-color: rgba(100,150,255,0.5); }
      input[type="date"] { color-scheme: dark; }

      .dur-row { display: flex; gap: 8px; }
      .dur-row .form-input { text-align: center; font-size: 18px; font-weight: 600; }
      .dur-label { font-size: 12px; color: rgba(220,232,255,0.5); text-align: center; margin-top: 4px; }
      .dur-preview {
        text-align: center; font-size: 13px;
        color: rgba(100,180,255,0.85); margin-top: 8px;
        min-height: 18px;
      }

      .btn-log {
        width: 100%; margin-top: 16px;
        background: hsl(217 91% 55%);
        color: #fff; border: none; border-radius: 12px;
        font-size: 15px; font-weight: 700; font-family: inherit;
        padding: 14px; cursor: pointer;
        transition: background .15s;
      }
      .btn-log:hover { background: hsl(217 91% 50%); }
      .btn-log:disabled { opacity: 0.5; cursor: not-allowed; }
      .log-result { text-align: center; font-size: 13px; margin-top: 8px; min-height: 18px; }
      .log-result.ok { color: hsl(142 65% 55%); }
      .log-result.err { color: hsl(0 70% 65%); }

      .entries-header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 12px;
      }
      .entries-title { font-size: 17px; font-weight: 700; }
      .entries-count { font-size: 13px; color: rgba(220,232,255,0.5); }

      .entry-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(100,150,255,0.10);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .entry-icon {
        width: 36px; height: 36px; border-radius: 10px;
        background: rgba(45,106,224,0.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; flex-shrink: 0;
      }
      .entry-body { flex: 1; min-width: 0; }
      .entry-row1 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
      .entry-tech { font-size: 14px; font-weight: 700; }
      .entry-dur { font-size: 14px; font-weight: 700; color: hsl(217 91% 70%); }
      .entry-row2 { font-size: 12px; color: rgba(220,232,255,0.55); display: flex; flex-wrap: wrap; gap: 6px; }
      .entry-tag {
        background: rgba(100,150,255,0.1);
        border-radius: 5px; padding: 2px 7px;
        font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
      }
      .entry-del {
        background: none; border: none; color: rgba(220,232,255,0.35);
        font-size: 16px; cursor: pointer; padding: 4px; flex-shrink: 0;
        border-radius: 6px; transition: color .15s;
      }
      .entry-del:hover { color: hsl(0 70% 65%); }

      .loading-text { color: rgba(220,232,255,0.45); font-size: 14px; padding: 24px 0; text-align: center; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <button id="refreshBtn" style="display:none;" type="button">Refresh</button>
        <div class="main-content">
          <div class="page-title">Time Tracking</div>

          <!-- Log form -->
          <div class="time-card">
            <div class="time-card-title">Log Time</div>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">Date</label>
                <input id="date" type="date" class="form-input" />
              </div>
              <div class="form-group">
                <label class="form-label">Technician</label>
                <select id="tech_id" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Job / Lead (optional)</label>
                <select id="lead_id" class="form-select"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Category</label>
                <select id="category" class="form-select">
                  <option value="work">⚡ Work</option>
                  <option value="drive">🚗 Drive</option>
                  <option value="admin">📋 Admin</option>
                </select>
              </div>
            </div>

            <!-- Duration picker -->
            <div style="margin-top: 14px;">
              <div class="form-label" style="margin-bottom: 8px;">Duration</div>
              <div class="dur-row">
                <div style="flex:1;">
                  <input id="hours" type="number" min="0" max="23" step="1" placeholder="0" class="form-input" />
                  <div class="dur-label">Hours</div>
                </div>
                <div style="flex:1;">
                  <input id="mins" type="number" min="0" max="59" step="15" placeholder="0" class="form-input" />
                  <div class="dur-label">Minutes</div>
                </div>
              </div>
              <div class="dur-preview" id="durPreview"></div>
            </div>

            <div class="form-group" style="margin-top: 12px;">
              <label class="form-label">Notes (optional)</label>
              <input id="notes" type="text" placeholder="What was worked on?" class="form-input" />
            </div>

            <button id="submitBtn" type="button" class="btn-log">Log Time</button>
            <div class="log-result" id="result"></div>
          </div>

          <!-- Recent entries -->
          <div class="entries-header">
            <div class="entries-title">Recent Entries</div>
            <div class="entries-count" id="entriesCount"></div>
          </div>
          <div id="entriesList"><div class="loading-text">Loading…</div></div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-time.js"></script>
    <script src="/pages/js/shell.js"></script>
    <script src="/pages/js/crm-fab.js"></script>
  </body>
</html>
