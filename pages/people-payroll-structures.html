<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salary Structures — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin:0; font-size:22px; font-weight:800; }
    .page-header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .btn-primary { padding:10px 20px; background:var(--blue); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-primary:hover { opacity:.88; }
    .struct-list { display:flex; flex-direction:column; gap:12px; }
    .struct-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
    .struct-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .struct-name { font-size:16px; font-weight:700; }
    .struct-desc { font-size:12px; color:var(--muted); margin-top:3px; }
    .struct-actions { display:flex; gap:8px; }
    .btn-icon { padding:6px 13px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--muted); font-family:inherit; }
    .btn-icon:hover { color:var(--text); border-color:rgba(100,150,255,.3); }
    .btn-del { color:#f87171; border-color:rgba(239,68,68,.2); }
    .btn-del:hover { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.4); }
    .comp-badges { display:flex; flex-wrap:wrap; gap:6px; }
    .comp-badge { display:inline-block; font-size:12px; padding:3px 9px; border-radius:6px; }
    .comp-badge.earning { background:rgba(52,211,153,.14); color:#34d399; }
    .comp-badge.deduction { background:rgba(248,113,113,.14); color:#f87171; }
    .empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty strong { display:block; font-size:16px; margin-bottom:6px; color:var(--text); }
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; align-items:center; justify-content:center; }
    .modal-backdrop.open { display:flex; }
    .modal { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:28px; width:100%; max-width:520px; margin:20px; max-height:90vh; overflow-y:auto; }
    .modal h2 { margin:0 0 20px; font-size:18px; font-weight:800; }
    .form-row { margin-bottom:14px; }
    .form-row label { display:block; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
    .form-row input, .form-row textarea { width:100%; box-sizing:border-box; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:14px; font-family:inherit; }
    .form-row textarea { resize:vertical; min-height:60px; }
    .form-row input:focus, .form-row textarea:focus { outline:none; border-color:var(--blue); }
    .comp-selector { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
    .comp-sel-item { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
    .comp-sel-item.selected { border-color:var(--blue); background:rgba(45,106,224,.12); }
    .comp-sel-item input[type=checkbox] { accent-color:var(--blue); }
    .comp-sel-name { flex:1; font-size:13px; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .btn-secondary { padding:10px 18px; background:transparent; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:#166534; color:#fff; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:700; opacity:0; transition:all .25s; z-index:200; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.error { background:#7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">
      <div class="page-header-row">
        <h1>Salary Structures</h1>
        <button class="btn-primary" id="addBtn">+ New Structure</button>
      </div>
      <div class="struct-list" id="structList">
        <div class="empty"><strong>Loading…</strong></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h2 id="modalTitle">New Salary Structure</h2>
    <input type="hidden" id="editId" />
    <div class="form-row">
      <label>Name *</label>
      <input type="text" id="fieldName" placeholder="e.g. Electrician — Standard" />
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea id="fieldDesc" placeholder="Optional description…"></textarea>
    </div>
    <div class="form-row">
      <label>Components (select all that apply)</label>
      <div class="comp-selector" id="compSelector"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-payroll-structures.js"></script>
</body>
</html>
