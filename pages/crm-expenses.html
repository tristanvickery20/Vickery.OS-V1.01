<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expenses &bull; Vickery CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <button id="refreshBtn" style="display:none;" type="button">Refresh</button>
        <div class="main-content">
          <div class="form-card">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-group">
                <label class="form-label">Date</label>
                <input id="date" type="date" />
              </div>
              <div class="form-group">
                <label class="form-label">Tech</label>
                <select id="tech_id"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Lead (optional)</label>
                <select id="lead_id"></select>
              </div>
              <div class="form-group">
                <label class="form-label">Type</label>
                <select id="type">
                  <option value="gas">Gas</option>
                  <option value="material">Material</option>
                  <option value="parts">Parts</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Vendor</label>
                <input id="vendor" placeholder="e.g. Shell, Home Depot" />
              </div>
              <div class="form-group">
                <label class="form-label">Amount ($)</label>
                <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" />
              </div>
              <div class="form-group">
                <label class="form-label">Notes</label>
                <input id="notes" placeholder="Optional notes" />
              </div>
              <div class="form-group">
                <label class="form-label">Receipt URL</label>
                <input id="receipt_url" placeholder="https://..." />
              </div>
            </div>
            <button id="submitBtn" type="button" class="btn-primary" style="width: 100%; margin-top: 12px;">
              Log Expense
            </button>
            <p id="result" class="muted" style="margin-top: 8px; text-align: center;"></p>
          </div>

          <h2>Recent Expenses</h2>
          <p id="status" class="status-text"></p>

          <div class="data-table-wrap">
            <table id="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Tech</th>
                  <th>Lead</th>
                  <th>Type</th>
                  <th>Vendor</th>
                  <th>Amount</th>
                  <th>Notes</th>
                  <th>Receipt</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <!-- QB Transactions pulled live from QuickBooks -->
          <div id="qbTxSection" style="margin-top:32px;display:none;">
            <h2 style="display:flex;align-items:center;gap:10px;">
              QuickBooks Transactions
              <span style="font-size:12px;font-weight:500;color:hsl(var(--muted-foreground));background:hsl(var(--muted));padding:2px 10px;border-radius:20px;">Live from QB</span>
            </h2>
            <p style="font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:10px;">
              Every purchase, card swipe, and expense recorded in QuickBooks — year to date.
            </p>
            <p id="qbTxStatus" class="status-text"></p>
            <div class="data-table-wrap">
              <table id="qbTxTable">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Payment Type</th>
                    <th>Account</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody id="qbTxBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-expenses.js"></script>
    <script src="/pages/js/shell.js"></script>
    <script src="/pages/js/crm-fab.js"></script>
  </body>
</html>
