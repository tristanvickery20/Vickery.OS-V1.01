<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Correction Requests — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .page-header-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
    }
    .back-link {
      font-size: 13px; color: var(--muted, rgba(220,232,255,0.6));
      text-decoration: none; display: flex; align-items: center; gap: 5px;
    }
    .back-link:hover { color: var(--text, #e6eefc); }

    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-bar select {
      padding: 8px 12px; background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--text, #e6eefc);
      font-size: 14px; font-family: inherit;
    }
    .filter-bar select:focus { outline: none; border-color: var(--blue, #2d6ae0); }

    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .corr-card {
      background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 14px; padding: 18px 20px;
    }
    .corr-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .corr-name { font-size: 15px; font-weight: 700; }
    .corr-meta { font-size: 12px; color: var(--muted, rgba(220,232,255,0.6)); margin-top: 2px; }
    .corr-reason { font-size: 13px; margin-bottom: 12px; color: var(--muted, rgba(220,232,255,0.8)); }

    .status-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      border-radius: 99px; padding: 3px 10px;
    }
    .status-pending  { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .status-approved { background: rgba(34,197,94,0.15);  color: #4ade80; }
    .status-rejected { background: rgba(239,68,68,0.12);  color: #f87171; }

    .corr-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .admin-notes-input {
      flex: 1; min-width: 160px; padding: 7px 10px;
      background: var(--bg, #0c1535); border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 8px; color: var(--text, #e6eefc); font-size: 13px; font-family: inherit;
    }
    .admin-notes-input:focus { outline: none; border-color: var(--blue, #2d6ae0); }
    .btn-approve {
      padding: 7px 14px; background: rgba(34,197,94,0.15); color: #4ade80;
      border: 1px solid rgba(34,197,94,0.3); border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-approve:hover { background: rgba(34,197,94,0.25); }
    .btn-reject {
      padding: 7px 14px; background: rgba(239,68,68,0.12); color: #f87171;
      border: 1px solid rgba(239,68,68,0.25); border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-reject:hover { background: rgba(239,68,68,0.2); }

    .resolved-note {
      font-size: 12px; color: var(--muted, rgba(220,232,255,0.6)); margin-top: 8px;
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted, rgba(220,232,255,0.7)); }
    .empty strong { display: block; font-size: 16px; margin-bottom: 6px; color: var(--text, #e6eefc); }
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #166534; color: #fff; padding: 12px 24px; border-radius: 12px;
      font-size: 14px; font-weight: 700; opacity: 0; transition: all .25s; z-index: 200;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #7f1d1d; }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">

      <div class="page-header-row">
        <div>
          <a class="back-link" href="/people/attendance">← Back to Attendance</a>
          <h1 style="margin-top:8px">Correction Requests</h1>
        </div>
      </div>

      <div class="filter-bar">
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option value="pending" selected>Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <div class="card-list" id="corrList">
        <div class="empty"><strong>Loading…</strong></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-attendance-corrections.js"></script>
</body>
</html>
