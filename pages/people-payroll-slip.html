<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Salary Slip — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin:0; font-size:22px; font-weight:800; }
    .back-link { color:var(--muted); font-size:13px; text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:16px; }
    .page-header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:24px; }
    .btn-secondary { padding:9px 18px; background:transparent; border:1px solid var(--line); border-radius:10px; color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
    .btn-secondary:hover { color:var(--text); }
    #slipContent { max-width:640px; }
    .slip-card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; }
    .slip-header { margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .slip-company { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-bottom:4px; }
    .slip-title { font-size:24px; font-weight:800; margin-bottom:8px; }
    .slip-meta { display:flex; gap:24px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
    .slip-meta span strong { color:var(--text); }
    .slip-section { margin-bottom:20px; }
    .slip-section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px; }
    .slip-table { width:100%; border-collapse:collapse; font-size:14px; }
    .slip-table th { text-align:left; padding:8px 0; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--line); }
    .slip-table td { padding:9px 0; border-bottom:1px solid rgba(100,150,255,.06); }
    .slip-table .right { text-align:right; }
    .slip-table tr:last-child td { border-bottom:none; }
    .slip-totals { border-top:1px solid var(--line); padding-top:18px; margin-top:4px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .slip-total-box { background:rgba(100,150,255,.07); border-radius:12px; padding:14px; }
    .slip-total-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
    .slip-total-value { font-size:20px; font-weight:800; }
    .net-pay { color:#34d399; }
    .share-row { margin-top:16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .share-input { flex:1; padding:9px 12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:12px; font-family:inherit; }
    .btn-copy { padding:9px 14px; background:var(--blue); color:#fff; border:none; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap; }
    .empty { text-align:center; padding:60px 20px; color:var(--muted); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:#166534; color:#fff; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:700; opacity:0; transition:all .25s; z-index:200; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    @media print {
      .back-link, .btn-secondary, .share-row, .sidebar, .mobile-bar { display:none !important; }
      .app-shell { display:block; }
      .main-area { margin:0; }
      .slip-card { border:none; padding:0; }
    }
  </style>
  <meta name="apple-mobile-web-app-capable" content="yes" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebarMount"></div>
  <div class="main-area">
    <div class="page-content">
      <a href="#" class="back-link" id="backLink">← Back to Run</a>
      <div class="page-header-row">
        <h1>Salary Slip</h1>
        <button class="btn-secondary" onclick="window.print()">Print / PDF</button>
      </div>
      <div id="slipContent"><div class="empty">Loading…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-payroll-slip.js"></script>
</body>
</html>
