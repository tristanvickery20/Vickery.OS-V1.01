<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Job Openings — Vickery Electric CRM</title>
  <link rel="icon" type="image/jpeg" href="/pages/img/crm-icon.jpg" />
  <link rel="stylesheet" href="/pages/css/shell.css" />
  <link rel="stylesheet" href="/pages/css/brand.css" />
  <style>
    h1 { margin: 0; font-size: 22px; font-weight: 800; }
    .page-header-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    .btn-primary {
      padding: 10px 20px; background: var(--blue, #2d6ae0); color: #fff;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit; text-decoration: none; display: inline-block;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-secondary {
      padding: 9px 16px; background: transparent; color: var(--text, #e6eefc);
      border: 1px solid var(--line, rgba(100,150,255,0.2)); border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      text-decoration: none; display: inline-block;
    }
    .btn-secondary:hover { border-color: rgba(100,150,255,0.4); }

    .filter-bar {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center;
    }
    select.filter-sel {
      padding: 9px 12px; background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--text, #e6eefc); font-size: 13px; font-family: inherit;
    }
    select.filter-sel:focus { outline: none; border-color: var(--blue); }

    .opening-card {
      background: var(--panel, #101e45);
      border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 14px; padding: 18px 20px;
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 12px;
    }
    .opening-card:hover { border-color: rgba(100,150,255,0.3); }
    .opening-info { flex: 1; min-width: 0; }
    .opening-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .opening-meta { font-size: 13px; color: var(--muted, rgba(220,232,255,0.7)); display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .opening-desc { font-size: 13px; color: var(--muted, rgba(220,232,255,0.6)); white-space: pre-line; }
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 99px;
      font-size: 11px; font-weight: 800;
    }
    .badge-open { background: hsl(140 60% 25%); color: hsl(140 70% 75%); }
    .badge-closed { background: hsl(0 30% 25%); color: hsl(0 50% 75%); }
    .badge-count { background: var(--blue, #2d6ae0); color: #fff; }
    .opening-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    .btn-icon {
      padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--line, rgba(100,150,255,0.14));
      background: transparent; color: var(--muted, rgba(220,232,255,0.7));
      font-family: inherit; transition: all .15s;
    }
    .btn-icon:hover { color: var(--text, #e6eefc); border-color: rgba(100,150,255,0.3); }
    .btn-icon.danger:hover { color: hsl(0 75% 65%); border-color: hsl(0 60% 45%); }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted, rgba(220,232,255,0.5)); font-size: 15px;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 1000;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel, #101e45); border: 1px solid var(--line, rgba(100,150,255,0.2));
      border-radius: 18px; padding: 28px; width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 800; }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--muted, rgba(220,232,255,0.7)); text-transform: uppercase; letter-spacing: .04em; }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: 10px 14px; box-sizing: border-box;
      background: var(--bg, #0a1628); border: 1px solid var(--line, rgba(100,150,255,0.14));
      border-radius: 10px; color: var(--text, #e6eefc); font-size: 14px; font-family: inherit;
    }
    .form-textarea { resize: vertical; min-height: 90px; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--blue); }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel {
      padding: 10px 18px; background: transparent;
      border: 1px solid var(--line, rgba(100,150,255,0.2));
      border-radius: 10px; color: var(--muted, rgba(220,232,255,0.7));
      font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="shell-body">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">&#9776;</button>
    </div>
    <main class="main-content">
      <div class="page-header-row">
        <h1>Job Openings</h1>
        <div class="header-actions">
          <a href="/people/applicants" class="btn-secondary">All Applicants</a>
          <a href="/careers" target="_blank" class="btn-secondary">Public Board</a>
          <button class="btn-primary" onclick="openCreateModal()">+ New Opening</button>
        </div>
      </div>

      <div class="filter-bar">
        <select class="filter-sel" id="statusFilter" onchange="applyFilter()">
          <option value="">All Statuses</option>
          <option value="Open">Open</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <div id="openingsList"></div>
    </main>
  </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="openingModal">
  <div class="modal">
    <h2 id="modalTitle">New Job Opening</h2>
    <input type="hidden" id="editOpeningId" />
    <div class="form-row">
      <label>Job Title *</label>
      <input class="form-input" id="fTitle" placeholder="e.g. Senior Electrician" />
    </div>
    <div class="form-row">
      <label>Department</label>
      <select class="form-select" id="fDept"></select>
    </div>
    <div class="form-row">
      <label>Designation</label>
      <select class="form-select" id="fDesig"></select>
    </div>
    <div class="form-row">
      <label>Status</label>
      <select class="form-select" id="fStatus">
        <option value="Open">Open</option>
        <option value="Closed">Closed</option>
      </select>
    </div>
    <div class="form-row">
      <label>Description</label>
      <textarea class="form-textarea" id="fDesc" placeholder="Role overview, requirements, responsibilities..."></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveOpening()">Save Opening</button>
    </div>
  </div>
</div>

<script src="/pages/js/shell.js"></script>
<script src="/pages/js/people-job-openings.js"></script>
</body>
</html>
