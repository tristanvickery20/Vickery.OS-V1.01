<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instant Quote &bull; Vickery Electric</title>
  <link rel="stylesheet" href="/pages/css/brand.css">
  <style>
    /* ── Quote page container ──────────────────────────────────────── */
    .q-wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    /* ── Progress bar ──────────────────────────────────────────────── */
    .q-progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      margin-bottom: 36px;
    }
    .q-prog-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .q-prog-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: hsl(var(--secondary));
      color: hsl(var(--muted-foreground));
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid hsl(var(--border));
      transition: all 0.2s;
    }
    .q-prog-step.active .q-prog-dot {
      background: hsl(var(--primary));
      color: white;
      border-color: hsl(var(--primary));
    }
    .q-prog-step.done .q-prog-dot {
      background: hsl(142 60% 45%);
      color: white;
      border-color: hsl(142 60% 45%);
    }
    .q-prog-label {
      font-size: 11px;
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .q-prog-step.active .q-prog-label { color: hsl(var(--primary)); }
    .q-prog-step.done .q-prog-label   { color: hsl(142 60% 38%); }
    .q-prog-line {
      width: 40px;
      height: 2px;
      background: hsl(var(--border));
      margin-bottom: 18px;
      transition: background 0.2s;
    }
    .q-prog-line.done { background: hsl(142 60% 45%); }
    @media (max-width: 400px) {
      .q-prog-line { width: 20px; }
      .q-prog-label { display: none; }
    }

    /* ── Typography ────────────────────────────────────────────────── */
    .q-heading {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: hsl(var(--foreground));
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }
    .q-muted { color: hsl(var(--muted-foreground)); font-size: 14px; line-height: 1.6; }
    .q-req   { color: hsl(var(--destructive)); }

    /* ── Service tiles ─────────────────────────────────────────────── */
    .q-tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 380px) { .q-tiles { grid-template-columns: 1fr; } }
    .q-tile {
      background: white;
      border: 2px solid hsl(var(--border));
      border-radius: 14px;
      padding: 20px 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: var(--font-body);
    }
    .q-tile:hover {
      border-color: hsl(var(--accent));
      box-shadow: 0 4px 16px hsl(var(--accent) / 0.12);
    }
    .q-tile.selected {
      border-color: hsl(var(--primary));
      background: hsl(var(--primary) / 0.04);
    }
    .q-tile-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: hsl(var(--foreground));
      margin-bottom: 4px;
    }
    .q-tile-sub {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      font-weight: 500;
    }

    /* ── Questions ─────────────────────────────────────────────────── */
    .q-questions { display: flex; flex-direction: column; gap: 24px; }
    .q-question  {}
    .q-question-prompt {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      color: hsl(var(--foreground));
      margin-bottom: 10px;
    }
    .q-options { display: flex; flex-direction: column; gap: 8px; }
    .q-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: hsl(var(--foreground));
      background: white;
      transition: all 0.15s;
    }
    .q-option:hover { border-color: hsl(var(--accent)); }
    .q-option.selected {
      border-color: hsl(var(--primary));
      background: hsl(var(--primary) / 0.05);
      color: hsl(var(--primary));
    }
    .q-option input { display: none; }
    .q-text-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      font-size: 15px;
      font-family: var(--font-body);
      background: white;
      color: hsl(var(--foreground));
      transition: border-color 0.15s;
    }
    .q-text-input:focus {
      outline: none;
      border-color: hsl(var(--accent));
    }

    /* ── Add-ons ───────────────────────────────────────────────────── */
    .q-section-label {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: hsl(var(--muted-foreground));
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 28px 0 12px;
    }
    .q-addons { display: flex; flex-direction: column; gap: 8px; }
    .q-addon {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      cursor: pointer;
      background: white;
      transition: all 0.15s;
    }
    .q-addon:hover { border-color: hsl(var(--accent)); }
    .q-addon.selected {
      border-color: hsl(var(--primary));
      background: hsl(var(--primary) / 0.04);
    }
    .q-addon input { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; margin-top: 2px; accent-color: hsl(var(--primary)); }
    .q-addon-name { font-size: 14px; font-weight: 600; color: hsl(var(--foreground)); }
    .q-addon-fee  { font-size: 13px; font-weight: 700; color: hsl(var(--accent)); margin-top: 2px; }
    .q-addon-desc { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 4px; }

    /* ── Price reveal ──────────────────────────────────────────────── */
    .q-price-reveal {
      text-align: center;
      padding: 32px 24px;
      background: white;
      border: 2px solid hsl(var(--border));
      border-radius: 20px;
      box-shadow: 0 4px 24px hsl(var(--primary) / 0.06);
    }
    .q-price-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: hsl(var(--muted-foreground));
      margin-bottom: 8px;
    }
    .q-price-big {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 800;
      color: hsl(var(--primary));
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .q-price-sub {
      font-size: 14px;
      color: hsl(var(--muted-foreground));
      margin-bottom: 16px;
    }
    .q-disclaimer {
      background: hsl(220 50% 97%);
      border: 1px solid hsl(var(--border));
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      margin-bottom: 10px;
      text-align: left;
    }
    .q-disclaimer.warn {
      background: hsl(38 90% 97%);
      border-color: hsl(38 90% 80%);
      color: hsl(30 80% 35%);
    }
    .q-bnpl {
      font-size: 13px;
      color: hsl(var(--muted-foreground));
      margin-top: 12px;
      padding: 10px 14px;
      background: hsl(142 50% 97%);
      border: 1px solid hsl(142 50% 80%);
      border-radius: 8px;
    }

    /* ── Lead form ─────────────────────────────────────────────────── */
    .q-form { display: flex; flex-direction: column; gap: 4px; }
    .q-field { margin-bottom: 16px; }
    .q-label {
      display: block;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: hsl(var(--foreground));
      margin-bottom: 6px;
    }
    .q-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      font-size: 16px;
      font-family: var(--font-body);
      background: white;
      color: hsl(var(--foreground));
      transition: border-color 0.15s;
    }
    .q-input:focus {
      outline: none;
      border-color: hsl(var(--accent));
      box-shadow: 0 0 0 3px hsl(var(--accent) / 0.12);
    }
    .q-zip-note {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      margin-top: 6px;
      font-style: italic;
    }
    .q-price-update {
      font-size: 14px;
      font-weight: 600;
      color: hsl(var(--foreground));
      margin-top: 6px;
      padding: 8px 12px;
      background: hsl(142 50% 97%);
      border: 1px solid hsl(142 50% 80%);
      border-radius: 8px;
    }
    .q-err {
      font-size: 14px;
      color: hsl(var(--destructive));
      font-weight: 600;
      padding: 10px 14px;
      background: hsl(0 84% 97%);
      border: 1px solid hsl(0 84% 85%);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .q-btn-primary {
      width: 100%;
      padding: 15px 24px;
      background: hsl(var(--primary));
      color: white;
      border: none;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: -0.01em;
    }
    .q-btn-primary:hover:not(:disabled) {
      background: hsl(var(--accent));
      transform: translateY(-1px);
      box-shadow: 0 4px 16px hsl(var(--accent) / 0.3);
    }
    .q-btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .q-btn-secondary {
      width: 100%;
      padding: 13px 24px;
      background: white;
      color: hsl(var(--primary));
      border: 2px solid hsl(var(--primary));
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .q-btn-secondary:hover:not(:disabled) {
      background: hsl(var(--primary));
      color: white;
    }
    .q-back {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
      padding: 0;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .q-back:hover { color: hsl(var(--foreground)); }

    /* ── Confirmed ─────────────────────────────────────────────────── */
    .q-confirmed { text-align: center; margin-bottom: 28px; }
    .q-confirmed-icon {
      font-size: 56px;
      margin-bottom: 12px;
      display: block;
    }
    .q-locked-price {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 800;
      color: hsl(var(--primary));
      letter-spacing: -0.03em;
      margin: 8px 0;
    }
    .q-next-step {
      text-align: center;
      padding: 24px;
      background: white;
      border: 2px solid hsl(var(--border));
      border-radius: 16px;
      margin-top: 20px;
    }
    .q-next-icon { font-size: 32px; margin-bottom: 8px; }

    /* ── Photo upload ───────────────────────────────────────────────── */
    .q-photo-gate {
      padding: 24px;
      background: hsl(220 50% 97%);
      border: 2px solid hsl(var(--border));
      border-radius: 16px;
      margin-top: 20px;
    }
    .q-photo-header {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      color: hsl(var(--foreground));
      margin-bottom: 8px;
    }
    .q-file-label {
      display: inline-block;
      padding: 10px 20px;
      background: hsl(var(--secondary));
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 4px;
    }
    .q-file-label:hover { border-color: hsl(var(--accent)); }
    .q-photo-preview { margin-top: 12px; }
    .q-photo-status {
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
      min-height: 20px;
      color: hsl(var(--foreground));
    }

    /* ── Loading / Error ───────────────────────────────────────────── */
    .q-loading {
      text-align: center;
      padding: 48px 24px;
    }
    .q-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid hsl(var(--border));
      border-top-color: hsl(var(--primary));
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .q-error-box {
      padding: 20px;
      background: hsl(0 84% 97%);
      border: 1px solid hsl(0 84% 85%);
      border-radius: 12px;
      font-size: 14px;
      color: hsl(var(--destructive));
      font-weight: 600;
      text-align: center;
    }
    .q-center { text-align: center; padding: 40px 24px; }
    .q-icon { font-size: 40px; margin-bottom: 12px; }

    /* ── Slot picker ────────────────────────────────────────────────── */
    .q-slot-groups { display: flex; flex-direction: column; gap: 20px; }
    .q-slot-group  {}
    .q-slot-date {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      color: hsl(var(--muted-foreground));
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .q-slot-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .q-slot {
      padding: 10px 18px;
      background: white;
      border: 2px solid hsl(var(--border));
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: hsl(var(--foreground));
      cursor: pointer;
      transition: all 0.15s;
    }
    .q-slot:hover { border-color: hsl(var(--accent)); color: hsl(var(--accent)); }
    .q-slot.selected {
      background: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: white;
    }

    /* ── Booking confirmation ────────────────────────────────────────── */
    .q-booked { text-align: center; margin-bottom: 28px; }
    .q-booked-icon { font-size: 64px; margin-bottom: 12px; display: block; }
    .q-booking-card {
      background: white;
      border: 2px solid hsl(var(--border));
      border-radius: 16px;
      overflow: hidden;
      margin-top: 20px;
    }
    .q-booking-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid hsl(var(--border));
    }
    .q-booking-row:last-child { border-bottom: none; }
    .q-booking-key {
      min-width: 100px;
      font-size: 13px;
      font-weight: 600;
      color: hsl(var(--muted-foreground));
      flex-shrink: 0;
    }
    .q-booking-val {
      font-size: 14px;
      font-weight: 600;
      color: hsl(var(--foreground));
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a href="/">
        <img src="/pages/img/logo.png" alt="Vickery Electric" class="header-logo">
      </a>
      <span class="header-title">Instant Quote</span>
      <a href="tel:+14095550100" class="nav-btn" style="font-size:13px;">Call Us</a>
    </div>
  </header>

  <main>
    <div class="q-wrap">
      <div id="qProgress"></div>
      <div id="stepContent"></div>
    </div>
  </main>

  <script src="/pages/js/quote.js"></script>
</body>
</html>
