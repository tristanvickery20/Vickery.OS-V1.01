<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Request &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
    <style>
      .rd-back { text-decoration:none; font-size:14px; color:hsl(var(--accent)); display:inline-flex; align-items:center; gap:4px; }
      .rd-back:hover { text-decoration:underline; }
      .rd-title { font-family:var(--font-display); font-size:22px; font-weight:700; margin:4px 0 0; }
      .rd-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin:20px 0; }
      .rd-card { background:#fff; border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:18px; }
      .rd-card-title { font-family:var(--font-display); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:hsl(var(--muted-foreground)); margin-bottom:8px; }
      .rd-card-body { font-size:14px; line-height:1.6; }
      .rd-card-body a { color:hsl(var(--accent)); text-decoration:none; }
      .rd-card-body a:hover { text-decoration:underline; }
      .rd-status { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:500; padding:3px 10px; border-radius:20px; background:hsl(var(--secondary)); }
      .rd-dot { width:7px; height:7px; border-radius:50%; }
      .rd-section { background:#fff; border:1px solid hsl(var(--border)); border-radius:var(--radius); padding:22px; margin-bottom:20px; }
      .rd-section-title { font-family:var(--font-display); font-weight:700; font-size:16px; margin-bottom:14px; }
      .rd-field { margin-bottom:14px; }
      .rd-label { display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:hsl(var(--muted-foreground)); margin-bottom:4px; }
      .rd-input, .rd-select, .rd-textarea { width:100%; box-sizing:border-box; padding:8px 12px; border:1px solid hsl(var(--border)); border-radius:var(--radius); font-size:14px; font-family:var(--font-body); }
      .rd-textarea { resize:vertical; min-height:70px; }
      .rd-input:focus, .rd-select:focus, .rd-textarea:focus { outline:none; border-color:hsl(var(--accent)); box-shadow:0 0 0 2px hsl(var(--accent)/.15); }
      .rd-toggle-row { display:flex; align-items:center; gap:10px; }
      .rd-toggle { width:18px; height:18px; accent-color:hsl(var(--primary)); }
      .rd-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
      .rd-btn { padding:10px 22px; border-radius:var(--radius); font-size:14px; font-weight:600; border:none; cursor:pointer; background:hsl(var(--primary)); color:#fff; transition:opacity .15s; }
      .rd-btn:hover { opacity:.9; }
      .rd-btn:disabled { opacity:.5; cursor:not-allowed; }
      .rd-msg { padding:10px 14px; border-radius:var(--radius); font-size:13px; margin-top:12px; }
      .rd-msg-error { background:hsl(0,84%,97%); color:hsl(0,84%,40%); border:1px solid hsl(0,84%,85%); }
      .rd-msg-success { background:hsl(142,71%,95%); color:hsl(142,71%,30%); border:1px solid hsl(142,71%,80%); }
      .rd-loading { text-align:center; padding:60px 20px; color:hsl(var(--muted-foreground)); }
      .rd-stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
      .rd-stat { text-align:center; }
      .rd-stat-val { font-family:var(--font-display); font-weight:700; font-size:20px; color:hsl(var(--primary)); }
      .rd-stat-label { font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; }
      @media (max-width:600px) {
        .rd-cards { grid-template-columns:1fr; }
        .rd-stat-grid { grid-template-columns:repeat(2,1fr); }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="page-header-row">
          <div>
            <a href="/requests" class="rd-back">&larr; Requests</a>
            <h1 class="rd-title" id="pageTitle">Loading...</h1>
          </div>
        </div>
        <div class="main-content" id="mainContent">
          <div class="rd-loading" id="loadingMsg">Loading request...</div>
          <div id="detailContent" style="display:none;"></div>
          <div id="errorMsg" style="display:none;" class="rd-loading"></div>
        </div>
      </main>
    </div>
    <script src="/pages/js/request-detail.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
