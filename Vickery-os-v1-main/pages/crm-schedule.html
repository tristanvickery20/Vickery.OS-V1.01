<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="page-header-row">
          <h1>Schedule</h1>
          <button id="refreshBtn" class="btn-outline" type="button">Refresh</button>
        </div>
        <div class="main-content">
          <div class="date-filter">
            <span>Show date:</span>
            <input id="date" type="date" style="width: auto;" />
          </div>

          <p id="status" class="status-text"></p>

          <div class="data-table-wrap">
            <table id="table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Lead</th>
                  <th>Tech</th>
                  <th>Duration</th>
                  <th>Status</th>
                  <th>Address</th>
                  <th>Preference</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-schedule.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
