<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lead Detail &bull; Vickery CRM</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
    <link rel="stylesheet" href="/pages/css/shell.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar" id="sidebarMount"></div>
      <main class="main-area">
        <div class="page-header-row">
          <h1 id="title">Lead Detail</h1>
        </div>
        <div class="main-content">
          <p id="status" class="status-text"></p>

          <div id="info" class="form-card" style="max-width:700px;"></div>

          <div id="financialSection" style="display:none; margin-top: 24px;">
            <h2>Financial Summary</h2>
            <div class="kpi-grid" style="max-width:700px;">
              <div class="kpi-card">
                <div class="kpi-label">Revenue</div>
                <div id="finRevenue" class="kpi-value">&mdash;</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Labor Cost</div>
                <div id="finLabor" class="kpi-value">&mdash;</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Expense Cost</div>
                <div id="finExpense" class="kpi-value">&mdash;</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Total Cost</div>
                <div id="finTotalCost" class="kpi-value">&mdash;</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Gross Profit</div>
                <div id="finProfit" class="kpi-value">&mdash;</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Gross Margin %</div>
                <div id="finMargin" class="kpi-value">&mdash;</div>
              </div>
            </div>
          </div>

          <div id="snapshotSection" style="display:none; margin-top: 24px;">
            <h2>Quote Snapshot</h2>
            <pre id="snapshot" style="background:hsl(var(--muted));padding:16px;border-radius:var(--radius);overflow-x:auto;font-size:13px;line-height:1.5;"></pre>
          </div>
        </div>
      </main>
    </div>

    <script src="/pages/js/api.js"></script>
    <script src="/pages/js/crm-lead-detail.js"></script>
    <script src="/pages/js/shell.js"></script>
  </body>
</html>
