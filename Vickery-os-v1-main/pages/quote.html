<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instant Quote &bull; Vickery Electric</title>
    <link rel="stylesheet" href="/pages/css/brand.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <img src="/pages/img/logo.png" alt="Vickery Electric" class="header-logo" />
        <span class="header-title">Instant Quote</span>
      </div>
    </header>

    <nav class="app-nav">
      <div class="nav-inner">
        <a class="nav-link active" href="/quote">Quote</a>
      </div>
    </nav>

    <main class="main-content">
      <h1>Instant Quote</h1>

      <div class="form-card" style="max-width: 460px;">
        <div class="form-group">
          <label class="form-label">Number of Recessed Lights</label>
          <input type="number" id="lights" value="1" min="1" />
        </div>

        <button class="btn-primary" style="width: 100%;" id="calcBtn">Calculate</button>

        <div id="result" style="margin-top: 20px; font-family: var(--font-display); font-size: 20px; font-weight: 700; color: hsl(var(--primary)); text-align: center;"></div>

        <div id="saveSection" style="display:none; margin-top: 24px; border-top: 1px solid hsl(var(--border)); padding-top: 16px;">
          <h3 style="margin-bottom: 12px;">Save as Lead</h3>
          <div class="form-group">
            <label class="form-label">Name</label>
            <input type="text" id="custName" placeholder="Customer name" />
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="tel" id="custPhone" placeholder="Phone number" />
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="text" id="custAddress" placeholder="Address" />
          </div>
          <button class="btn-primary" style="width: 100%;" id="saveBtn">Save as Lead</button>
          <div id="saveResult" class="small" style="margin-top: 12px; text-align: center;"></div>
        </div>
      </div>
    </main>

    <script src="/pages/js/quote.js"></script>
  </body>
</html>
